function aggregate(countries){
  const kf = keyFn();
  const buckets = {};
  function cell(k,c){
    buckets[k] = buckets[k] || {};
    buckets[k][c] = buckets[k][c] || {shipped:0,packed:0,picked:0,pallet:0,pkg:0,weight:0,bookings:0,cutoffDays:0,handlingEa:0,packingCost:0,lastMileCost:0,airCost:0,truckingCost:0,handlingCost:0};
    return buckets[k][c];
  }
  CD.Cache.daily.forEach(r=>{
    if(!countries.includes(r.country) || !inRange(r.date)) return;
    const k = kf(r.date); const b = cell(k, r.country);
    b.shipped += r.shipped||0; b.packed += r.packed||0; b.picked += r.picked||0;
    b.packingCost += packingCostUsd(r) * fxRate(r.country);
    b.lastMileCost += (r.shipped||0) * (rateFor(r.country).lastMile||0);
  });
  CD.Cache.shipments.forEach(s=>{
    if(!CD.isBilledShip(s)) return;                       // 예정 건은 회계에 잡지 않는다
    if(!countries.includes(s.country) || !inRange(s.cutoffDate)) return;
    const k = kf(s.cutoffDate); const b = cell(k, s.country);
    b.weight += billableWeight(s);
    b.pallet += s.palletCount||0; b.pkg += s.packageCount||0; b.bookings += 1;
    b.airCost += airCostUsd(s) * fxRate(s.country);
  });
  // 트럭킹 — 컷오프 날짜 단위 정액을 국가별로 안분해 넣는다
  const truck = truckingByDate(aRange.start, aRange.end);
  Object.keys(truck).forEach(date=>{
    const k = kf(date);
    Object.keys(truck[date]).forEach(c=>{
      if(!countries.includes(c)) return;
      const b = cell(k, c);
      b.truckingCost += truck[date][c] * fxRate(c);
      b.cutoffDays += 1;
    });
  });
  // 취급주의 출고비 — 날짜로 쪼갠 EA를 구간에 싣는다
  const hea = handlingEaByDate();
  const hRate = handlingRate();
  Object.keys(hea).forEach(date=>{
    if(!inRange(date)) return;
    const k = kf(date);
    Object.keys(hea[date]).forEach(c=>{
      if(!countries.includes(c)) return;
      const b = cell(k, c);
      b.handlingEa += hea[date][c];
      b.handlingCost += hea[date][c] * hRate * fxRate(c);
    });
  });
  const keys = Object.keys(buckets).sort();
  return keys.map(k=>({key:k, byCountry:buckets[k]}));
}

function bucketTotal(row){
  const countries = Object.keys(row.byCountry);
  return countries.reduce((acc,c)=>{
    const b = row.byCountry[c];
    acc.shipped+=b.shipped; acc.packingCost+=b.packingCost; acc.lastMileCost+=b.lastMileCost;
    acc.airCost+=b.airCost; acc.truckingCost+=b.truckingCost||0; acc.handlingCost+=b.handlingCost||0;
    return acc;
  }, {shipped:0, packingCost:0, lastMileCost:0, airCost:0, truckingCost:0, handlingCost:0});
}
function bucketCost(b){ return b.packingCost + b.lastMileCost + b.airCost + (b.truckingCost||0) + (b.handlingCost||0); }

/* ---------------------------------------------------------------------
   증감 비교는 화면의 집계 단위(일/주/월/연)와 상관없이 항상 "최근 30일 vs
   직전 30일"로 본다. 월 단위로 비교하면 진행 중인 달이 항상 손해로 보인다.
   --------------------------------------------------------------------- */
const overlay = document.getElementById("modalOverlay");
const modalBody = document.getElementById("modalBody");
function closeAcctModal(){ overlay.hidden = true; modalBody.className = "modal"; modalBody.innerHTML = ""; }
// 바깥을 눌러 닫을 때도 wide 변형이 남지 않게 되돌린다 (닫기 자체는 다른 모듈이 처리)
overlay.addEventListener("click", e=>{ if(e.target===overlay) modalBody.className = "modal"; });
let hdQ = "", hdPage = 0, hdCountry = "ALL", hdEditing = null;
const HD_PER = 12;
let skuQ = "", skuPage = 0;
const SKU_PER = 15;
let lastRows = [], lastCountries = [];      // 엑셀 내보내기가 화면과 같은 값을 쓰도록 보관

/**
 * 증감 비교 구간 = 화면에서 고른 기간 그 자체 vs 바로 앞의 같은 길이 구간.
 * 최근 90일을 고르면 직전 90일과, 올해를 고르면 직전 같은 일수와 비교된다.
 */
function deltaWindows(){
  const start = aRange.start, end = aRange.end;
  const days = Math.max(1, Math.round((CD.parseISO(end)-CD.parseISO(start))/86400000) + 1);
  const pEnd = CD.addDays(start, -1);
  const pStart = CD.addDays(pEnd, -(days-1));
  return { start, end, pStart, pEnd, days };
}
/** "직전 90일" 처럼 사람이 읽는 구간 이름 */
function deltaLabel(days){
  if(days % 365 === 0) return `직전 ${days/365}년`;
  if(days % 30 === 0 && days >= 30) return `직전 ${days}일`;
  return `직전 ${days}일`;
}
/** 한 구간(시작~종료, 양 끝 포함)의 국가별 수량·비용 합계 (각 국가 현지통화 기준) */
function rangeAgg(start, end, countries){
  const by = {};
  countries.forEach(c=> by[c] = {shipped:0, packingCost:0, lastMileCost:0, airCost:0, truckingCost:0, handlingCost:0});
  CD.Cache.daily.forEach(r=>{
    if(!by[r.country] || !r.date || r.date < start || r.date > end) return;
    const b = by[r.country];
    b.shipped += r.shipped||0;
    b.packingCost += packingCostUsd(r) * fxRate(r.country);
    b.lastMileCost += (r.shipped||0) * (rateFor(r.country).lastMile||0);
  });
  CD.Cache.shipments.forEach(sh=>{
    if(!CD.isBilledShip(sh)) return;
    if(!by[sh.country] || !sh.cutoffDate || sh.cutoffDate < start || sh.cutoffDate > end) return;
    by[sh.country].airCost += airCostUsd(sh) * fxRate(sh.country);
  });
  const truck = truckingByDate(start, end);
  Object.keys(truck).forEach(date=>{
    Object.keys(truck[date]).forEach(c=>{
      if(by[c]) by[c].truckingCost += truck[date][c] * fxRate(c);
    });
  });
  const hea = handlingEaByDate(), hRate = handlingRate();
  Object.keys(hea).forEach(date=>{
    if(date < start || date > end) return;
    Object.keys(hea[date]).forEach(c=>{
      if(by[c]) by[c].handlingCost += hea[date][c] * hRate * fxRate(c);
    });
  });
  return by;
}

function refresh(){
  if(!built) return;
  renderRateForms();
  renderHandling();
  const countries = countryFilter==="ALL" ? CD.COUNTRIES : [countryFilter];
  const rows = aggregate(countries);
  const dw = deltaWindows();

  // KPIs — money totals are kept per-country (KRW and JPY are not summed together)
  let sumShipped=0;
  rows.forEach(r=>{ const t = bucketTotal(r); sumShipped+=t.shipped; });

  if(!rows.length){
    const aK0 = document.getElementById("aKpis");
    aK0.className = "section";
    aK0.innerHTML = `<div class="card"><div class="empty-note">${rangeText()} 구간에 데이터가 없습니다. 기간을 넓혀보세요.</div></div>`;
    document.getElementById("aCostKpis").innerHTML = "";
    document.getElementById("aCostHint").textContent = rangeText();
    document.getElementById("aTrendChart").innerHTML = "";
    document.getElementById("aTrendLegend").innerHTML = "";
    document.getElementById("aCompWrap").innerHTML = "";
    document.getElementById("aCompLegend").innerHTML = "";
    document.getElementById("aPerOrderKpis").innerHTML = "";
    document.getElementById("aPerOrderHint").textContent = rangeText();
    document.getElementById("aTables").innerHTML = "";
    document.getElementById("aTableHint").textContent = rangeText();
    return;
  }
  const cur30 = rangeAgg(dw.start, dw.end, countries);
  const prev30 = rangeAgg(dw.pStart, dw.pEnd, countries);
  const dLbl = deltaLabel(dw.days);
  function countryStats(c){
    let shipped=0, cost=0;
    rows.forEach(r=>{ const b=r.byCountry[c]; if(b){ shipped+=b.shipped; cost+=bucketCost(b); } });
    const perOrder = shipped>0 ? cost/shipped : 0;
    // 증감은 선택 기간 건당비용 vs 바로 앞 같은 길이 구간
    let deltaPct = null;
    const nb = cur30[c], pb = prev30[c];
    const nowPO  = nb && nb.shipped>0 ? bucketCost(nb)/nb.shipped : null;
    const prevPO = pb && pb.shipped>0 ? bucketCost(pb)/pb.shipped : null;
    if(nowPO!=null && prevPO) deltaPct = ((nowPO-prevPO)/prevPO)*100;
    return {shipped, cost, perOrder, deltaPct};
  }

  const kpiCountries = countryFilter==="ALL" ? CD.COUNTRIES : [countryFilter];
  const totalCostDisp = kpiCountries.reduce((s,c)=> s + toDisp(countryStats(c).cost, c), 0);
  const label = kpiCountries.map(c=>CD.COUNTRY_LABEL[c]).join('+');
  // 윗줄: 총 출고 수량 · 총 물류비 (각 2칸)  /  아랫줄: 국가별 물류비 · 건당 평균비용 (각 1칸)
  const oneCountry = kpiCountries.length === 1;
  const rangeSub = rangeText();
  const cards = [
    `<div class="kpi wide">${CD.kpiIcon("ship","g")}<div class="label">총 출고 수량</div><div class="value">${CD.fmtNum(sumShipped)}</div><div class="sub">${label} 합계 · ${rangeSub}</div></div>`,
    `<div class="kpi wide">${CD.kpiIcon("money")}<div class="label">총 물류비</div><div class="value">${fmtDisp0(totalCostDisp)}</div><div class="sub">출고비+통관·택배+항공+트럭킹+취급주의 · ${rangeSub}</div></div>`
  ];
  kpiCountries.forEach(c=>{
    const st = countryStats(c);
    const costDisp = toDisp(st.cost, c), perOrderDisp = toDisp(st.perOrder, c);
    const flat = st.deltaPct!=null && Math.abs(st.deltaPct) < 0.05;
    const dCls = (st.deltaPct==null || flat) ? "" : (st.deltaPct<0 ? " good" : " bad");
    const dot = `<span class="dot" style="background:var(--${c.toLowerCase()})"></span>`;
    const wide = oneCountry ? " wide" : "";     // 국가 하나면 아랫줄도 2칸씩 채운다
    cards.push(`<div class="kpi${wide}"><div class="label">${dot}${CD.COUNTRY_LABEL[c]} 물류비용</div><div class="value">${fmtDisp0(costDisp)}</div><div class="sub" title="출고비+통관·택배+항공+트럭킹+취급주의">${CD.fmtShort(aRange.start)}~${CD.fmtShort(aRange.end)} 합계</div></div>`);
    cards.push(`<div class="kpi${wide}"><div class="label">${dot}${CD.COUNTRY_LABEL[c]} 건당 평균비용</div><div class="value">${fmtDisp(perOrderDisp)}</div><div class="sub">${st.deltaPct==null?`<span class="delta">${dLbl} 비교 불가</span>`:`<span class="delta${dCls}">${flat?"":(st.deltaPct>0?"↑":"↓")}${Math.abs(st.deltaPct).toFixed(1)}%</span><span style="color:var(--muted)">${dLbl} 대비</span>`}</div></div>`);
  });
  const aK = document.getElementById("aKpis");
  aK.className = "section grid kpis24";
  aK.innerHTML = cards.join("");
  CD.fitKpi(document.getElementById("aKpis"));

  /* ---- 비용 항목별 (출고비 / 통관·택배비 / 항공비) ---- */
  const COST_KEYS = [
    {key:"packingCost",  label:"출고비",      color:"--cost-pack"},
    {key:"lastMileCost", label:"통관·택배비",  color:"--cost-lastmile"},
    {key:"airCost",      label:"항공비",      color:"--cost-air"},
    {key:"truckingCost", label:"트럭킹비",     color:"--cost-truck"},
    {key:"handlingCost", label:"취급주의 출고비", color:"--cost-handling"},
  ];
  /** 한 구간(row)의 특정 비용 항목을 표시 통화로 합산 */
  function bucketTypeSum(row, key){
    return kpiCountries.reduce((sum,c)=>{
      const b = row.byCountry[c];
      return b ? sum + toDisp(b[key]||0, c) : sum;
    }, 0);
  }
  const typeTotals = {};
  COST_KEYS.forEach(t=>{ typeTotals[t.key] = rows.reduce((sum,r)=> sum + bucketTypeSum(r, t.key), 0); });
  const grandTotal = COST_KEYS.reduce((sum,t)=> sum + typeTotals[t.key], 0);

  /** 비교 창 하나의 특정 비용 항목을 표시 통화로 합산 */
  function winTypeSum(win, key){
    return kpiCountries.reduce((sum,c)=>{
      const b = win[c];
      return b ? sum + toDisp(b[key]||0, c) : sum;
    }, 0);
  }
  document.getElementById("aCostHint").textContent =
    `${label} · ${rangeText()} 합계 · ${dispSym()} 기준 · 증감은 이 기간 vs ${dLbl}(${CD.fmtShort(dw.pStart)}~${CD.fmtShort(dw.pEnd)})`;
  document.getElementById("aCostKpis").innerHTML = COST_KEYS.map(t=>{
    const total = typeTotals[t.key];
    const share = grandTotal>0 ? total/grandTotal*100 : 0;
    let d = null;                                   // 선택 기간 vs 직전 동일 길이 구간
    const now = winTypeSum(cur30, t.key);
    const before = winTypeSum(prev30, t.key);
    if(before>0) d = (now-before)/before*100;
    const dFlat = d!=null && Math.abs(d) < 0.05;
    const dCls = (d==null || dFlat) ? "" : (d<0 ? " good" : " bad");
    const dTxt = d==null ? `<span class="delta">비교 불가</span>`
                         : `<span class="delta${dCls}">${dFlat?"":(d>0?"↑":"↓")}${Math.abs(d).toFixed(1)}%</span>`;
    return `<div class="kpi">
      <div class="label"><span class="dot" style="background:var(${t.color})"></span>${t.label}</div>
      <div class="value">${fmtDisp0(total)}</div>
      <div class="sub">${dTxt}<span style="color:var(--muted)">전체의 ${share.toFixed(1)}%</span></div>
      <div style="height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;">
        <div style="height:100%; width:${share}%; background:var(${t.color}); border-radius:3px;"></div>
      </div>
    </div>`;
  }).join("");
  CD.fitKpi(document.getElementById("aCostKpis"));

  /* ---- 주문 건당 평균 비용 (트럭킹은 항공비에 합산) ---- */
  const PER_ORDER = [
    {label:"건당 출고비",        keys:["packingCost"],               color:"--cost-pack"},
    {label:"건당 통관·택배비",    keys:["lastMileCost"],              color:"--cost-lastmile"},
    {label:"건당 항공비",        keys:["airCost","truckingCost"],    color:"--cost-air", note:"트럭킹 포함"},
    {label:"건당 취급주의 출고비", keys:["handlingCost"],              color:"--cost-handling"},
  ];
  /** 한 국가의 특정 비용 항목 합계 (표시 통화) */
  function typeSumFor(c, keys){
    return rows.reduce((sum,r)=>{
      const b = r.byCountry[c];
      return b ? sum + keys.reduce((x,k)=> x + toDisp(b[k]||0, c), 0) : sum;
    }, 0);
  }
  function shippedFor(c){
    return rows.reduce((sum,r)=>{ const b = r.byCountry[c]; return b ? sum + b.shipped : sum; }, 0);
  }
  const perOrderTotal = PER_ORDER.reduce((sum,t)=>{
    const cost = kpiCountries.reduce((x,c)=> x + typeSumFor(c, t.keys), 0);
    return sum + (sumShipped>0 ? cost/sumShipped : 0);
  }, 0);
  document.getElementById("aPerOrderHint").textContent =
    `${label} · ${rangeText()} · 출고 ${CD.fmtNum(sumShipped)}건 기준 · 합계 ${fmtDisp(perOrderTotal)}`;
  document.getElementById("aPerOrderKpis").innerHTML = PER_ORDER.map(t=>{
    const cost = kpiCountries.reduce((x,c)=> x + typeSumFor(c, t.keys), 0);
    const per = sumShipped>0 ? cost/sumShipped : 0;
    // 국가가 둘 이상이면 통합 평균만으로는 어느 쪽이 비싼지 안 보인다
    const byC = kpiCountries.length>1 ? kpiCountries.map(c=>{
      const sh = shippedFor(c);
      const v = sh>0 ? typeSumFor(c, t.keys)/sh : 0;
      return `<span class="dot" style="background:var(--${c.toLowerCase()})"></span>${CD.COUNTRY_LABEL[c]} ${fmtDisp(v)}`;
    }).join(" · ") : `총 ${fmtDisp0(cost)}`;
    return `<div class="kpi">
      <div class="label"><span class="dot" style="background:var(${t.color})"></span>${t.label}${t.note?` <span style="color:var(--muted)">(${t.note})</span>`:""}</div>
      <div class="value">${fmtDisp(per)}</div>
      <div class="sub">${byC}</div>
    </div>`;
  }).join("");
  CD.fitKpi(document.getElementById("aPerOrderKpis"));

  // trend chart: one line per country (cost per order), all converted to the selected display currency
  const labels = rows.map(r=>keyLabel(r.key));
  const series = countries.map(c=>({
    key:c, label: CD.COUNTRY_LABEL[c], color: CD.cssVar("--"+c.toLowerCase()),
    fmt: v=> fmtDisp(v),
    values: rows.map(r=>{
      const b = r.byCountry[c];
      if(!b || b.shipped<=0) return NaN;
      return toDisp(bucketCost(b)/b.shipped, c);
    })
  }));
  Charts.lineChart(document.getElementById("aTrendChart"), {
    series, labels, yFmt: (v,d)=> dispSym()+CD.fmtNum(v,d),
    legend: document.getElementById("aTrendLegend")
  });
  {
    const fx = CD.Cache.settings.fx || {};
    const fxNote = `1 USD = ₩${CD.fmtNum(fx.usdKrw||0)} · ¥${CD.fmtNum(fx.usdJpy||0)}${fx.auto?' · 실시간':''}`;
    document.getElementById("aTrendLegend").insertAdjacentHTML("beforeend", `<div class="item" style="color:var(--muted)">${fxNote}</div>`);
  }

  // composition chart: per country small multiple, stacked fulfill vs air — values converted to the selected display currency
  const compWrap = document.getElementById("aCompWrap");
  compWrap.innerHTML = "";
  compWrap.className = "grid " + (countries.length>1?"even":"");
  countries.forEach((c,i)=>{
    const box = document.createElement("div");
    box.innerHTML = `<div class="row" style="margin-bottom:6px;"><span class="badge ${c.toLowerCase()}">${CD.COUNTRY_LABEL[c]}</span></div><div class="chart-holder"></div>`;
    compWrap.appendChild(box);
    // 출고비와 취급주의 출고비는 같은 창고 작업비라 한 칸으로 쌓고, 툴팁에서 나눠 보여준다
    const data = rows.map(r=>{
      const b = r.byCountry[c] || {};
      const pack = toDisp(b.packingCost||0, c);
      const hand = toDisp(b.handlingCost||0, c);
      return {
        date: r.key,
        packingTotal: pack + hand,
        packingCost: pack,
        handlingCost: hand,
        lastMileCost: toDisp(b.lastMileCost||0, c),
        airCost: toDisp(b.airCost||0, c),
        truckingCost: toDisp(b.truckingCost||0, c)
      };
    });
    const compColor = {packingTotal:"--cost-pack", lastMileCost:"--cost-lastmile", airCost:"--cost-air", truckingCost:"--cost-truck"};
    const compLabel = {packingTotal:"출고비 (취급주의 포함)", lastMileCost:"통관 택배비용", airCost:"항공비용", truckingCost:"트럭킹비"};
    Charts.stackedBarChart(box.querySelector(".chart-holder"), {
      data, keys:["packingTotal","lastMileCost","airCost","truckingCost"],
      subKeys:{ packingTotal:[{key:"packingCost", label:"출고비"}, {key:"handlingCost", label:"취급주의 출고비"}] },
      colorFn:k=> CD.cssVar(compColor[k]),
      labelFn:k=> compLabel[k],
      xLabelFn: keyLabel, tipTitleFn: keyLabel,
      valueFmt: v=> fmtDisp(v),
      axisFmt: v=> Charts.compactMoney(dispSym(), v),
      legend: i===countries.length-1 ? document.getElementById("aCompLegend") : null
    });
  });

  // 기간별 상세 — 국가별로 표를 나누고, 각 구간에 직전 구간 대비 증감을 붙인다
  const granLabel = gran==='day'?'일별':gran==='week'?'주별':gran==='month'?'월별':'연도별';
  document.getElementById("aTableHint").textContent =
    `${rangeText()} · ${granLabel} ${rows.length}개 구간 · ${dispSym()} 기준` +
    (rows.length > 60 ? " · 구간이 많습니다. 월별/연도별로 보시면 읽기 편합니다." : "");

  lastRows = rows; lastCountries = countries;   // 엑셀 내보내기가 화면과 같은 값을 쓰도록 보관

  /** 직전 구간 대비 증감 칩 (비용은 낮을수록 좋으므로 내려가면 초록) */
  function chg(now, before, goodUp){
    if(before===null || before===undefined || before===0) return `<span class="chg flat">–</span>`;
    const p = (now-before)/before*100;
    if(!isFinite(p)) return `<span class="chg flat">–</span>`;
    if(Math.abs(p) < 0.05) return `<span class="chg flat">0.0%</span>`;
    const up = p > 0;
    const cls = (goodUp ? up : !up) ? "good" : "bad";
    return `<span class="chg ${cls}">${up?"↑":"↓"}${Math.abs(p).toFixed(1)}%</span>`;
  }
  const maxTotal = Math.max(1, ...countries.flatMap(c=>
    rows.map(r=>{ const b=r.byCountry[c]; return b ? toDisp(bucketCost(b), c) : 0; })));

  document.getElementById("aTables").innerHTML = countries.map(c=>{
    const ordered = [...rows];                 // 오래된 → 최신 (증감 계산용)
    const trs = [];
    const sum = {picked:0,packed:0,shipped:0,bookings:0,pallet:0,weight:0,
                 packingCost:0,lastMileCost:0,airCost:0,truckingCost:0,handlingCost:0,total:0};
    /* 합계 행은 각 줄을 화면에 찍힌 자릿수로 끊어서 더한다.
       원값을 더해 한 번만 반올림하면 열을 세로로 더했을 때 합계와 몇 단위씩 어긋난다. */
    const dsum = {packingCost:0,lastMileCost:0,airCost:0,truckingCost:0,handlingCost:0,total:0};
    for(let i = ordered.length-1; i >= 0; i--){    // 표시는 최신 → 오래된
      const b = ordered[i].byCountry[c]; if(!b) continue;
      const prev = i>0 ? ordered[i-1].byCountry[c] : null;
      const total = bucketCost(b);
      const po = b.shipped>0 ? total/b.shipped : 0;
      const prevPo = prev && prev.shipped>0 ? bucketCost(prev)/prev.shipped : null;
      const totalDisp = toDisp(total, c);
      const barPct = Math.max(2, Math.min(100, totalDisp/maxTotal*100));
      ["picked","packed","shipped","bookings","pallet","weight",
       "packingCost","lastMileCost","airCost","truckingCost","handlingCost"].forEach(k=> sum[k] += (b[k]||0));
      sum.total += total;
      dsum.packingCost  += Math.round(toDisp(b.packingCost, c));
      dsum.lastMileCost += Math.round(toDisp(b.lastMileCost, c));
      dsum.airCost      += Math.round(toDisp(b.airCost, c));
      dsum.truckingCost += Math.round(toDisp(b.truckingCost||0, c));
      dsum.handlingCost += Math.round(toDisp(b.handlingCost||0, c));
      dsum.total        += Math.round(totalDisp);
      trs.push(`<tr>
        <td class="text stick">${keyLabel(ordered[i].key)}</td>
        <td class="num dim">${CD.fmtNum(b.picked)}</td>
        <td class="num dim">${CD.fmtNum(b.packed)}</td>
        <td class="num key">${CD.fmtNum(b.shipped)}</td>
        <td class="text">${chg(b.shipped, prev?prev.shipped:null, true)}</td>
        <td class="num dim gsep">${CD.fmtNum(b.bookings)}건 · ${CD.fmtNum(b.pallet)}PLT</td>
        <td class="num dim">${CD.fmtNum(b.weight)}</td>
        <td class="num gsep">${fmtDisp0(toDisp(b.packingCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(b.lastMileCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(b.airCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(b.truckingCost||0, c))}</td>
        <td class="num" title="취급주의 ${CD.fmtNum(Math.round(b.handlingEa||0))} EA">${fmtDisp0(toDisp(b.handlingCost||0, c))}</td>
        <td class="num key">
          <div class="cost-cell"><span>${fmtDisp0(totalDisp)}</span>
            <span class="cost-bar"><i style="width:${barPct.toFixed(1)}%"></i></span></div>
        </td>
        <td class="num key gsep">${fmtDisp(toDisp(po, c))}</td>
        <td class="text">${chg(po, prevPo, false)}</td>
      </tr>`);
    }
    const sumPo = sum.shipped>0 ? sum.total/sum.shipped : 0;
    const foot = trs.length ? `<tfoot><tr>
        <td class="text stick">합계</td>
        <td class="num">${CD.fmtNum(sum.picked)}</td>
        <td class="num">${CD.fmtNum(sum.packed)}</td>
        <td class="num">${CD.fmtNum(sum.shipped)}</td>
        <td></td>
        <td class="num gsep">${CD.fmtNum(sum.bookings)}건 · ${CD.fmtNum(sum.pallet)}PLT</td>
        <td class="num">${CD.fmtNum(sum.weight)}</td>
        <td class="num gsep">${fmtDisp0(dsum.packingCost)}</td>
        <td class="num">${fmtDisp0(dsum.lastMileCost)}</td>
        <td class="num">${fmtDisp0(dsum.airCost)}</td>
        <td class="num">${fmtDisp0(dsum.truckingCost)}</td>
        <td class="num">${fmtDisp0(dsum.handlingCost)}</td>
        <td class="num">${fmtDisp0(dsum.total)}</td>
        <td class="num gsep">${fmtDisp(toDisp(sumPo, c))}</td>
        <td></td>
      </tr></tfoot>` : "";
    return `<div class="card" style="margin-bottom:14px;">
      <div class="row between" style="margin-bottom:10px;">
        <span class="badge ${c.toLowerCase()}">${CD.COUNTRY_LABEL[c]}</span>
        <span class="hint">출고 ${CD.fmtNum(sum.shipped)}건 · 물류비 ${fmtDisp0(dsum.total)} · 건당 ${fmtDisp(toDisp(sumPo, c))}</span>
      </div>
      <div class="table-wrap">
        <table class="detail">
          <thead>
            <tr class="grp-row">
              <th class="stick"></th>
              <th colspan="4">물동량</th>
              <th colspan="2" class="gsep">항공</th>
              <th colspan="6" class="gsep">비용 (${dispSym()})</th>
              <th colspan="2" class="gsep">건당</th>
            </tr>
            <tr class="col-row">
              <th class="stick">기간</th>
              <th class="num">픽킹</th><th class="num">팩킹</th><th class="num">출고</th><th>전 구간비</th>
              <th class="num gsep">부킹</th><th class="num" title="항공비 청구 중량 — 부피무게 적용일 이전은 실중량(kg 반올림)">청구중량</th>
              <th class="num gsep">출고비</th><th class="num">통관·택배</th><th class="num">항공</th>
              <th class="num" title="컷오프가 있는 날 하루당 정액">트럭킹</th>
              <th class="num" title="취급주의 SKU 출고 EA × 단가">취급주의</th>
              <th class="num">총비용</th>
              <th class="num gsep">건당비용</th><th>전 구간비</th>
            </tr>
          </thead>
          <tbody>${trs.join("") || `<tr><td colspan="15" class="text empty-note">표시할 데이터가 없습니다.</td></tr>`}</tbody>
          ${foot}
        </table>
      </div>
    </div>`;
  }).join("");
}

CD.on("daily", refresh);
CD.on("shipments", refresh);
CD.on("settings", refresh);
CD.on("handling", refresh);
CD.on("handlingSkus", ()=>{ refresh(); renderSkuList(); });
CD.on("tab", t=>{ if(t==="accounting") refresh(); else if(t==="dashboard") renderHandling(); });
CD.on("ready", ()=>{ shell(); refresh(); });
})();
</script>


<script>
/* =====================================================================
   MONTHLY REPORT — 물류 총괄용 월간 요약.
   "이번 달이 어땠고, 전월 대비 무엇이 달라졌나"를 한 화면에서 판단할 수 있게
   물량 / 처리 단계별 전환율 / 합포장 효율 / 건당 물류비를 전월과 나란히 둔다.
   ===================================================================== */
(function(){
"use strict";
const CD = window.CD, Charts = window.CDCharts;
const root = document.getElementById("view-report");
let built = false;
/* 월 단위로 보면 이번 달이 진행 중일 때 비교가 왜곡된다. 그래서 오늘 기준 롤링 구간으로 본다. */
let days = 30;                    // 최근 N일
let countryFilter = "ALL";
let cur = "KRW";
try{ cur = localStorage.getItem("cargodesk_dispCurrency") || "KRW"; }catch(e){}

/* ---------- 비용 기준 (회계 탭과 동일한 계산식) ---------- */
function S(){ return CD.Cache.settings || {}; }
function fxRate(c){ const f=S().fx||{}; return c==="KR" ? (f.usdKrw||1300) : (f.usdJpy||150); }
function fxOf(x){ const f=S().fx||{}; return x==="USD"?1 : x==="KRW"?(f.usdKrw||1300) : (f.usdJpy||150); }
function sym(){ return cur==="USD"?"$" : cur==="KRW"?"₩" : "¥"; }
function toDisp(localAmt, c){ return ((localAmt||0)/fxRate(c))*fxOf(cur); }
function fmtMoney(v){
  if(cur==="USD") return "$"+(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return sym()+CD.fmtNum(v||0);
}
function packRates(){ return S().packing || {baseUsd:1.29, stepUsd:0.6}; }
function tierUsd(k){ const p=packRates(); return p.baseUsd + p.stepUsd*(k-1); }
function airTiers(){ return CD.airCfg(S()); }
function lastMileOf(c){ return (S()[c]||{}).lastMile || 0; }
function truckPerDay(){ const t = S().trucking || {}; return t.perDayUsd == null ? 100 : Number(t.perDayUsd)||0; }
function handlingPerEa(){ const h = S().handling || {}; return h.perEaUsd == null ? 0.39 : Number(h.perEaUsd)||0; }
/** 청구 중량 = 부피무게 (없으면 실중량 → 컷오프 중량) */
function billableWeight(s){ return CD.airBillableWeight(s, S()); }

/* ---------- 구간 집계 (시작일~종료일, 양 끝 포함) ---------- */
function aggregate(start, end, countries){
  const a = { days:0, picked:0, packed:0, shipped:0, boxes:0, skuUnits:0,
              packCost:0, lastMileCost:0, airCost:0, truckCost:0, handlingCost:0, handlingEa:0, cutoffDays:0,
              peak:{date:null, v:0}, byCountry:{} };
  countries.forEach(c=> a.byCountry[c] = {picked:0,packed:0,shipped:0,boxes:0,skuUnits:0,cost:0,days:0});
  const dayset = new Set();
  CD.Cache.daily.forEach(r=>{
    if(!r.date || r.date < start || r.date > end || !countries.includes(r.country)) return;
    const b = a.byCountry[r.country];
    dayset.add(r.date); b.days++;
    a.picked += r.picked||0; a.packed += r.packed||0; a.shipped += r.shipped||0;
    b.picked += r.picked||0; b.packed += r.packed||0; b.shipped += r.shipped||0;
    let pkUsd = 0;
    for(let k=1;k<=CD.PACK_MAX;k++){
      const n = r["pack"+k]||0;
      if(!n) continue;
      a.boxes += n; b.boxes += n;
      a.skuUnits += n*k; b.skuUnits += n*k;
      pkUsd += n*tierUsd(k);
    }
    const pc = toDisp(pkUsd*fxRate(r.country), r.country);
    const lm = toDisp((r.shipped||0)*lastMileOf(r.country), r.country);
    a.packCost += pc; a.lastMileCost += lm;
    b.cost += pc + lm;
    if((r.shipped||0) > a.peak.v) a.peak = {date:r.date, v:r.shipped||0};
  });
  a.days = dayset.size;                       // 국가가 둘이어도 같은 날은 하루로 센다
  CD.Cache.shipments.forEach(s=>{
    if(!CD.isBilledShip(s)) return;
    if(!s.cutoffDate || s.cutoffDate < start || s.cutoffDate > end || !countries.includes(s.country)) return;
    const usd = CD.airCostUsd(s, S());                              // 전환일 · 구간요율 · 최소청구액 모두 반영
    const v = toDisp(usd*fxRate(s.country), s.country);
    a.airCost += v;
    if(a.byCountry[s.country]) a.byCountry[s.country].cost += v;
  });
  // 트럭킹 — 컷오프가 있는 날 하루당 정액. 국가별로는 그날 부피중량 비율로 안분한다.
  const wByDate = {};
  CD.Cache.shipments.forEach(s=>{
    if(!CD.isBilledShip(s)) return;
    if(!s.cutoffDate || s.cutoffDate < start || s.cutoffDate > end) return;
    const d = wByDate[s.cutoffDate] = wByDate[s.cutoffDate] || {};
    d[s.country] = (d[s.country]||0) + billableWeight(s);
  });
  const perDay = truckPerDay();
  Object.keys(wByDate).forEach(date=>{
    const w = wByDate[date];
    const cs = Object.keys(w);
    const tot = cs.reduce((x,c)=> x + w[c], 0);
    cs.forEach(c=>{
      if(!countries.includes(c)) return;
      const usd = tot > 0 ? perDay*(w[c]/tot) : perDay/cs.length;
      const v = toDisp(usd*fxRate(c), c);
      a.truckCost += v;
      if(a.byCountry[c]) a.byCountry[c].cost += v;
    });
    if(cs.some(c=>countries.includes(c))) a.cutoffDays++;
  });
  // 취급주의 출고비 — 월(또는 일) 단위 EA를 그 기간의 일별 출고 비율로 쪼개 구간에 싣는다
  const hRate = handlingPerEa();
  (CD.Cache.handling||[]).forEach(h=>{
    const ea = Number(h.ea)||0;
    if(!ea || !h.period || !countries.includes(h.country)) return;
    const isDay = h.period.length === 10;
    const days = CD.Cache.daily.filter(d=> d.country===h.country && d.date &&
      (isDay ? d.date===h.period : d.date.slice(0,7)===h.period));
    const tot = days.reduce((x,d)=> x + (d.shipped||0), 0);
    let inEa = 0;
    if(days.length && tot > 0){
      days.forEach(d=>{ if(d.date >= start && d.date <= end) inEa += ea*((d.shipped||0)/tot); });
    }else{
      const date = isDay ? h.period
        : h.period + "-" + CD.pad2(CD.daysInMonth(Number(h.period.slice(0,4)), Number(h.period.slice(5,7))-1));
      if(date >= start && date <= end) inEa = ea;
    }
    if(!inEa) return;
    const v = toDisp(inEa*hRate*fxRate(h.country), h.country);
    a.handlingEa += inEa;
    a.handlingCost += v;
    if(a.byCountry[h.country]) a.byCountry[h.country].cost += v;
  });
  a.total = a.packCost + a.lastMileCost + a.airCost + a.truckCost + a.handlingCost;
  a.perOrder = a.shipped>0 ? a.total/a.shipped : 0;
  a.packRate = a.picked>0 ? a.packed/a.picked : null;      // 픽킹 → 팩킹
  a.shipRate = a.packed>0 ? a.shipped/a.packed : null;     // 팩킹 → 출고
  a.skuPerBox = a.boxes>0 ? a.skuUnits/a.boxes : 0;
  a.avgDaily = a.days>0 ? a.shipped/a.days : 0;
  return a;
}

function months(){
  const set = new Set();
  CD.Cache.daily.forEach(r=>{ if(r.date) set.add(r.date.slice(0,7)); });
  return [...set].sort();
}
/** 월별 추이 차트용 — "YYYY-MM" 한 달치를 구간 집계로 돌린다 */
function aggMonth(m, countries){
  const start = m + "-01";
  const end = m + "-" + CD.pad2(CD.daysInMonth(Number(m.slice(0,4)), Number(m.slice(5,7))-1));
  return aggregate(start, end, countries);
}
/** 현재 선택 구간과 그 직전 동일 길이 구간 */
function windows(){
  const end = CD.todayISO();
  const start = CD.addDays(end, -(days-1));
  const pEnd = CD.addDays(start, -1);
  const pStart = CD.addDays(pEnd, -(days-1));
  return { start, end, pStart, pEnd };
}
function rangeLabel(a, b){ return `${CD.fmtShort(a)}~${CD.fmtShort(b)}`; }
function pct(now, before){
  if(before===null || before===undefined || before===0) return null;
  return ((now-before)/before)*100;
}
/** delta chip — 증가가 좋은 지표(good=true)면 초록, 비용처럼 낮을수록 좋은 지표면 반대 */
function delta(now, before, goodUp){
  const p = pct(now, before);
  if(p===null) return `<span class="delta">직전 ${days}일 데이터 없음</span>`;
  const up = p>0, flat = Math.abs(p) < 0.05;
  let cls = "";
  if(goodUp!==null && !flat) cls = (goodUp?up:!up) ? " good" : " bad";
  return `<span class="delta${cls}">${flat?"":(up?"↑":"↓")}${Math.abs(p).toFixed(1)}%</span>` +
         `<span style="color:var(--muted)">직전 ${days}일 대비</span>`;
}

/* ---------- 자동 인사이트 ---------- */
function insights(a, b){
  const out = [];
  const VS = `직전 ${days}일 대비`;
  const pShip = pct(a.shipped, b.shipped);
  if(pShip!==null && Math.abs(pShip)>=3){
    out.push(`출고량이 ${VS} <b>${pShip>0?"+":""}${pShip.toFixed(1)}%</b> (${CD.fmtNum(b.shipped)} → ${CD.fmtNum(a.shipped)}개) ${pShip>0?"증가":"감소"}했습니다.`);
  }
  const pDay = pct(a.avgDaily, b.avgDaily);
  if(pShip!==null && pDay!==null && Math.abs(pShip-pDay)>=4){
    out.push(`가동일이 ${b.days}일 → ${a.days}일로 달라져, 일평균 기준으로 보면 <b>${pDay>0?"+":""}${pDay.toFixed(1)}%</b>입니다. 총량 증감과 실제 처리 능력 변화를 구분해서 보셔야 합니다.`);
  }
  const pCost = pct(a.perOrder, b.perOrder);
  if(pCost!==null && Math.abs(pCost)>=2){
    out.push(`건당 물류비가 ${fmtMoney(b.perOrder)} → <b>${fmtMoney(a.perOrder)}</b> (${pCost>0?"+":""}${pCost.toFixed(1)}%)로 ${pCost>0?"악화":"개선"}됐습니다.`);
  }
  if(a.skuPerBox && b.skuPerBox){
    const d = a.skuPerBox - b.skuPerBox;
    if(Math.abs(d)>=0.03){
      // 박스 수 = 팩킹 건수로 고정이고, 단가는 종류가 하나 늘 때마다 올라간다.
      // 따라서 박스당 SKU 상승 = 박스 단가 상승 = 출고비 상승.
      const cpbA = a.boxes>0 ? a.packCost/a.boxes : 0;
      const cpbB = b.boxes>0 ? b.packCost/b.boxes : 0;
      out.push(`박스당 SKU가 ${b.skuPerBox.toFixed(2)} → <b>${a.skuPerBox.toFixed(2)}</b>로 ${d>0?"늘었":"줄었"}습니다. 종류가 하나 늘 때마다 단가가 붙는 구조라 박스당 출고비가 ${fmtMoney(cpbB)} → <b>${fmtMoney(cpbA)}</b>로 ${d>0?"오르는":"내리는"} 요인입니다.`);
    }
  }
  if(a.shipRate!==null && a.shipRate < 0.95){
    const carry = a.packed - a.shipped;
    out.push(`팩킹 대비 출고율이 <b>${(a.shipRate*100).toFixed(1)}%</b>로, ${CD.fmtNum(carry)}건이 이 구간 안에 출고되지 않았습니다. 항공 스케줄 또는 컷오프 일정을 확인해보세요.`);
  } else if(a.shipRate!==null && a.shipRate > 1.05){
    out.push(`팩킹보다 출고가 <b>${(a.shipRate*100).toFixed(1)}%</b>로 많습니다. 이전 구간 이월 물량이 이 구간에 나간 것으로 보입니다.`);
  }
  if(a.packRate!==null && a.packRate < 0.95){
    out.push(`픽킹 대비 팩킹률이 <b>${(a.packRate*100).toFixed(1)}%</b>입니다. 픽킹 후 포장까지 넘어가지 못한 물량이 있는지 확인이 필요합니다.`);
  }
  if(a.peak.date && a.avgDaily>0 && a.peak.v/a.avgDaily >= 2){
    out.push(`최다 출고일은 ${CD.fmtFull(a.peak.date)} <b>${CD.fmtNum(a.peak.v)}개</b>로 일평균(${CD.fmtNum(a.avgDaily)}개)의 ${(a.peak.v/a.avgDaily).toFixed(1)}배입니다. 특정일 물량 집중이 큽니다.`);
  }
  const cs = Object.keys(a.byCountry).filter(c=>a.byCountry[c].shipped>0);
  if(cs.length>1){
    const tot = cs.reduce((s,c)=>s+a.byCountry[c].shipped,0);
    const totB = cs.reduce((s,c)=>s+(b.byCountry[c]?b.byCountry[c].shipped:0),0);
    cs.forEach(c=>{
      if(!tot || !totB) return;
      const sh = a.byCountry[c].shipped/tot*100;
      const shB = (b.byCountry[c]?b.byCountry[c].shipped:0)/totB*100;
      if(Math.abs(sh-shB)>=5){
        out.push(`${CD.COUNTRY_LABEL[c]} 비중이 ${shB.toFixed(1)}% → <b>${sh.toFixed(1)}%</b>로 ${sh>shB?"확대":"축소"}됐습니다.`);
      }
    });
  }
  if(!out.length) out.push(`직전 ${days}일과 비교해 특별히 눈에 띄는 변화는 없습니다.`);
  return out;
}

/* ---------- 화면 ---------- */
function shell(){
  root.innerHTML = `
    <div class="section row between">
      <div class="row">
        <div class="seg" id="rpRangeSeg">
          <button data-v="7">최근 7일</button>
          <button data-v="30" class="active">최근 30일</button>
          <button data-v="90">최근 90일</button>
        </div>
        <div class="seg" id="rpCountrySeg">
          <button data-v="ALL" class="active">전체</button>
          <button data-v="KR">한국</button>
          <button data-v="JP">일본</button>
        </div>
      </div>
      <div class="seg" id="rpCurSeg">
        <button data-v="KRW">₩ 원화</button>
        <button data-v="JPY">¥ 엔화</button>
        <button data-v="USD">$ 달러</button>
      </div>
    </div>

    <div class="section grid kpis3" id="rpKpis"></div>

    <div class="section grid two">
      <div class="card">
        <div class="section-head"><h2 id="rpSummaryTitle">최근 30일 요약</h2><span class="hint" id="rpVs"></span></div>
        <ul id="rpInsights" style="margin:0; padding-left:18px; font-size:12.5px; line-height:1.85;"></ul>
      </div>
      <div class="card">
        <div class="section-head"><h2>처리 단계별 전환</h2></div>
        <div id="rpFunnel"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>국가별 비교</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>국가</th><th>픽킹</th><th>팩킹</th><th>출고</th><th>박스</th><th>박스당 SKU</th><th>물류비</th><th>건당비용</th><th id="rpThDelta">직전 구간 대비 출고</th></tr></thead>
          <tbody id="rpTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>월별 출고량 추이</h2></div>
      <div class="card"><div id="rpTrendChart"></div><div class="chart-legend" id="rpTrendLegend"></div></div>
    </div>

    <div class="section">
      <div class="section-head"><h2>월별 건당 물류비 추이</h2></div>
      <div class="card"><div id="rpCostChart"></div><div class="chart-legend" id="rpCostLegend"></div></div>
    </div>
  `;
  document.getElementById("rpRangeSeg").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    days = Number(b.dataset.v);
    [...b.parentElement.children].forEach(c=>c.classList.toggle("active", c===b));
    refresh();
  });
  document.getElementById("rpCountrySeg").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    countryFilter=b.dataset.v; [...b.parentElement.children].forEach(c=>c.classList.toggle("active",c===b)); refresh();
  });
  document.getElementById("rpCurSeg").querySelectorAll("button").forEach(b=> b.classList.toggle("active", b.dataset.v===cur));
  document.getElementById("rpCurSeg").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    cur=b.dataset.v; [...b.parentElement.children].forEach(c=>c.classList.toggle("active",c===b));
    try{ localStorage.setItem("cargodesk_dispCurrency", cur); }catch(err){}
    refresh();
  });
  built = true;
}

function kpi(label, value, sub){
  return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
}
function bar(label, value, ofValue, color){
  const wPct = ofValue>0 ? Math.min(100, value/ofValue*100) : 0;
  return `<div style="margin-bottom:12px;">
    <div class="row between" style="font-size:12px; margin-bottom:5px;">
      <span>${label}</span><span class="mono">${CD.fmtNum(value)} <span style="color:var(--muted)">(${wPct.toFixed(1)}%)</span></span>
    </div>
    <div style="height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;">
      <div style="height:100%; width:${wPct}%; background:${color}; border-radius:5px;"></div>
    </div>
  </div>`;
}

function refresh(){
  if(!built) return;
  const ms = months();
  if(!ms.length){ document.getElementById("rpKpis").innerHTML = `<div class="empty-note">데이터가 없습니다.</div>`; return; }

  const countries = countryFilter==="ALL" ? CD.COUNTRIES : [countryFilter];
  const w = windows();
  const a = aggregate(w.start, w.end, countries);
  const b = aggregate(w.pStart, w.pEnd, countries);
  document.getElementById("rpSummaryTitle").textContent = `최근 ${days}일 요약`;
  document.getElementById("rpThDelta").textContent = `직전 ${days}일 대비 출고`;
  document.getElementById("rpVs").textContent =
    `최근 ${days}일 (${rangeLabel(w.start, w.end)}) vs 직전 ${days}일 (${rangeLabel(w.pStart, w.pEnd)})`;

  document.getElementById("rpKpis").innerHTML = [
    kpi("출고 수량", CD.fmtNum(a.shipped), delta(a.shipped, b.shipped, true)),
    kpi("팩킹 수량", CD.fmtNum(a.packed), delta(a.packed, b.packed, true)),
    kpi("일평균 출고", CD.fmtNum(a.avgDaily), `가동 ${a.days}일 (직전 ${b.days}일)`),
    kpi("총 물류비", fmtMoney(a.total), delta(a.total, b.total, false)),
    kpi("건당 물류비", fmtMoney(a.perOrder), delta(a.perOrder, b.perOrder, false)),
    kpi("박스당 SKU", a.skuPerBox.toFixed(2), b.skuPerBox ? delta(a.skuPerBox, b.skuPerBox, null) : `직전 ${days}일 데이터 없음`),
  ].join("");

  CD.fitKpi(document.getElementById("rpKpis"));

  document.getElementById("rpInsights").innerHTML = insights(a, b).map(t=>`<li>${t}</li>`).join("");

  document.getElementById("rpFunnel").innerHTML =
      bar("픽킹", a.picked, a.picked, "var(--kr)")
    + bar("팩킹", a.packed, a.picked, "var(--jp)")
    + bar("출고", a.shipped, a.picked, "var(--good)")
    + `<div class="row" style="gap:18px; margin-top:14px; font-size:12px;">
         <span>픽킹→팩킹 <b>${a.packRate!==null?(a.packRate*100).toFixed(1)+"%":"-"}</b></span>
         <span>팩킹→출고 <b>${a.shipRate!==null?(a.shipRate*100).toFixed(1)+"%":"-"}</b></span>
       </div>`;

  document.getElementById("rpTableBody").innerHTML = countries.map(c=>{
    const x = a.byCountry[c], y = b.byCountry[c] || {shipped:0};
    const spb = x.boxes>0 ? x.skuUnits/x.boxes : 0;
    const po = x.shipped>0 ? x.cost/x.shipped : 0;
    return `<tr>
      <td class="text"><span class="badge ${c.toLowerCase()}">${CD.COUNTRY_LABEL[c]}</span></td>
      <td>${CD.fmtNum(x.picked)}</td><td>${CD.fmtNum(x.packed)}</td><td>${CD.fmtNum(x.shipped)}</td>
      <td>${CD.fmtNum(x.boxes)}</td><td>${spb.toFixed(2)}</td>
      <td>${fmtMoney(x.cost)}</td><td>${fmtMoney(po)}</td>
      <td class="text">${delta(x.shipped, y.shipped, true)}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="9" class="text empty-note">데이터가 없습니다.</td></tr>`;

  // 최근 12개월 추이
  const recent = ms.slice(-12);
  const trendData = recent.map(m=>{
    const g = aggMonth(m, countries);
    const row = {date:m};
    countries.forEach(c=> row[c] = g.byCountry[c].shipped);
    return row;
  });
  Charts.stackedBarChart(document.getElementById("rpTrendChart"), {
    data: trendData, keys: countries,
    colorFn: c=> CD.cssVar("--"+c.toLowerCase()),
    labelFn: c=> CD.COUNTRY_LABEL[c],
    xLabelFn: CD.monthLabel, tipTitleFn: CD.monthLabel,
    valueFmt: v=> CD.fmtNum(v)+"개",
    legend: document.getElementById("rpCostLegend") ? document.getElementById("rpTrendLegend") : null
  });

  const costSeries = countries.map(c=>({
    key:c, label: CD.COUNTRY_LABEL[c], color: CD.cssVar("--"+c.toLowerCase()),
    fmt: v=> fmtMoney(v),
    values: recent.map(m=>{
      const g = aggMonth(m, [c]);
      return g.shipped>0 ? g.total/g.shipped : NaN;
    })
  }));
  Charts.lineChart(document.getElementById("rpCostChart"), {
    series: costSeries, labels: recent.map(CD.monthLabel),
    yFmt: (v,d)=> sym()+CD.fmtNum(v,d),
    legend: document.getElementById("rpCostLegend")
  });
}

CD.on("daily", refresh);
CD.on("shipments", refresh);
CD.on("settings", refresh);
CD.on("handling", refresh);
CD.on("tab", t=>{ if(t==="report") refresh(); });
CD.on("ready", ()=>{ shell(); refresh(); });
})();
</script>

<script>
/* =====================================================================
   INVOICES TAB — 협력사별 청구 인보이스와 추이
   · 한 인보이스에 여러 항목(라인)을 담는다
   · Nyunnie는 직접 입력, BINEX / 은하쉬핑 / 고쿠사이는 대시보드 데이터로 자동 계산
   ===================================================================== */
(function(){
"use strict";
const CD = window.CD, Charts = window.CDCharts;
const root = document.getElementById("view-invoices");
const overlay = document.getElementById("modalOverlay");
const modalBody = document.getElementById("modalBody");
let built = false;

/* ---------- 협력사 마스터 ---------- */
const VENDORS = [
  { key:"NYUNNIE", label:"Nyunnie", currency:"USD", color:"--cost-pack", mode:"manual",
    items:["packing","handling","trucking","storage","disposal","supplies","other"],
    note:"미국 창고 — 항목별 직접 입력" },
  { key:"BINEX", label:"BINEX", currency:"USD", color:"--cost-air", mode:"auto",
    auto:{ item:"air" }, items:["air","other"],
    note:"항공 운송 — 항공비는 컷오프 데이터로 자동 계산" },
  { key:"EUNHA", label:"은하쉬핑", currency:"KRW", color:"--cost-lastmile", mode:"auto",
    auto:{ item:"customs", country:"KR" }, items:["customs","other"],
    note:"한국 통관·택배 — 출고 수량 × 건당 단가로 자동 계산" },
  { key:"KOKUSAI", label:"고쿠사이", currency:"JPY", color:"--good", mode:"auto",
    auto:{ item:"customs", country:"JP" }, items:["customs","other"],
    note:"일본 통관·택배 — 출고 수량 × 건당 단가로 자동 계산" },
];
const V_BY_KEY = {}; VENDORS.forEach(v=> V_BY_KEY[v.key] = v);

const ITEM_LABEL = {
  packing:"출고비", handling:"취급주의 포장비", trucking:"트럭킹비", storage:"보관비",
  disposal:"폐기비", supplies:"부자재", other:"기타비용",
  air:"항공비", customs:"통관·택배비",
  discount:"할인", credit:"크레딧",
  fixed:"추가 고정비"   // 예전 데이터 호환용
};
const ITEM_COLOR = {
  packing:"--cost-pack", handling:"--cost-handling", trucking:"--cost-truck", storage:"--cost-air",
  disposal:"--cost-lastmile", supplies:"--good", other:"--muted",
  air:"--cost-air", customs:"--cost-lastmile",
  discount:"--good-ink", credit:"--ink-2", fixed:"--muted"
};
const ITEM_ORDER = ["packing","handling","trucking","storage","disposal","supplies","air","customs","fixed","other"];
/* 청구를 깎는 줄들 — 합계에서 빼고, 누적 막대(구성)에서는 제외한다.
   · 할인(discount) = 그 인보이스 안에서 깎인 금액. 인보이스 합계에 바로 반영된다.
   · 크레딧(credit) = 인보이스와 별개로 그 달에 돌려받는 금액. */
const DEDUCT_ITEMS = ["discount","credit"];
function isDeduct(item){ return DEDUCT_ITEMS.indexOf(item) >= 0; }
function itemsFor(vk){ const v = V_BY_KEY[vk]; return v ? v.items.slice() : []; }
function signedAmt(item, amount){ return (isDeduct(item) ? -1 : 1) * (Number(amount)||0); }

/* ---------- 통화 ---------- */
let cur = "KRW";
try{ cur = localStorage.getItem("cargodesk_dispCurrency") || "KRW"; }catch(e){}
function fxOf(c){
  const f = CD.Cache.settings.fx || {};
  return c==="USD" ? 1 : c==="KRW" ? (f.usdKrw||1300) : (f.usdJpy||150);
}
function sym(c){ c = c || cur; return c==="USD" ? "$" : c==="KRW" ? "₩" : "¥"; }
function toDisp(amount, fromCur){ return ((amount||0) / fxOf(fromCur||"USD")) * fxOf(cur); }
function dispDec(c){ return (c||cur) === "USD" ? 2 : 0; }
function fmtD0(v){
  const d = dispDec();
  return (v<0?"-":"") + sym() + Math.abs(v||0).toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtIn(amount, c){
  const a = Number(amount)||0;
  const d = c==="USD" ? 2 : (Math.abs(a - Math.round(a)) > 0.004 ? 2 : 0);
  return (a<0?"-":"") + sym(c) + Math.abs(a).toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d});
}
function roundDisp(v){ const p = Math.pow(10, dispDec()); return Math.round((v||0)*p)/p; }
/** 한 라인의 환산액 (크레딧은 음수) */
function dispAmt(L){ return roundDisp(toDisp(signedAmt(L.item, L.amount), L.currency)); }
/** 한 라인의 환산액 (부호 없이) */
function dispGross(L){ return roundDisp(toDisp(L.amount, L.currency)); }

/* ---------- 기간 (월 단위) ---------- */
function addMonths(p, n){
  let y = Number(p.slice(0,4)), m = Number(p.slice(5,7)) + n;
  while(m > 12){ m -= 12; y++; }
  while(m < 1){ m += 12; y--; }
  return y + "-" + String(m).padStart(2,"0");
}
function thisMonth(){ return CD.todayISO().slice(0,7); }
function monthsAgo(n){ return addMonths(thisMonth(), -n); }
const iRange = { start: monthsAgo(5), end: thisMonth() };
try{
  const saved = JSON.parse(localStorage.getItem("cargodesk_invRange") || "null");
  if(saved && saved.start && saved.end){ iRange.start = saved.start; iRange.end = saved.end; }
}catch(e){}
function saveRange(){ try{ localStorage.setItem("cargodesk_invRange", JSON.stringify(iRange)); }catch(e){} }
function monthList(start, end){
  const out = [];
  let [y,m] = start.split("-").map(Number);
  const [ey,em] = end.split("-").map(Number);
  let guard = 0;
  while((y < ey || (y===ey && m<=em)) && guard++ < 600){
    out.push(y + "-" + String(m).padStart(2,"0"));
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function monthSpan(){ return monthList(iRange.start, iRange.end).length; }
function prevRange(){
  const span = monthSpan();
  const pEnd = addMonths(iRange.start, -1);
  return { start: addMonths(pEnd, -(span-1)), end: pEnd, span };
}
function earliestPeriod(){
  let min = null;
  (CD.Cache.invoices||[]).forEach(r=>{ if(r.period && (!min || r.period < min)) min = r.period; });
  (CD.Cache.daily||[]).forEach(r=>{ const p = (r.date||"").slice(0,7); if(p && (!min || p < min)) min = p; });
  (CD.Cache.shipments||[]).forEach(s=>{ const p = (s.cutoffDate||"").slice(0,7); if(p && (!min || p < min)) min = p; });
  return min || monthsAgo(11);
}

/* ---------------------------------------------------------------------
   저장 형태 정규화
   한 인보이스 = { id, vendor, invoiceNo, date, period, currency, memo, lines:[{item,amount,memo}] }
   예전에 저장된 한 줄짜리 기록도 라인 하나짜리 인보이스로 읽는다.
   --------------------------------------------------------------------- */
function asDoc(rec){
  if(Array.isArray(rec.lines)) return rec;
  return { id:rec.id, vendor:rec.vendor, invoiceNo:rec.invoiceNo||"", date:rec.date||"",
           period:rec.period, currency:rec.currency, memo:"",
           lines:[{ item:rec.item, amount:rec.amount, memo:rec.memo||"" }] };
}
function docTotal(doc){ return doc.lines.reduce((s,l)=> s + signedAmt(l.item, l.amount), 0); }
function docDispTotal(doc){
  return doc.lines.reduce((s,l)=> s + roundDisp(toDisp(signedAmt(l.item, l.amount), doc.currency)), 0);
}

/* ---------------------------------------------------------------------
   자동 계산
   --------------------------------------------------------------------- */
function autoAmount(vendorKey, period){
  const v = V_BY_KEY[vendorKey];
  if(!v || v.mode !== "auto") return null;
  if(v.auto.item === "air"){
    let sum = 0;
    (CD.Cache.shipments||[]).forEach(s=>{
      if(CD.isBilledShip(s) && (s.cutoffDate||"").slice(0,7) === period) sum += CD.airCostUsd(s);
    });
    return sum;
  }
  if(v.auto.item === "customs"){
    const c = v.auto.country;
    const rate = ((CD.Cache.settings||{})[c] || {}).lastMile || 0;
    let ea = 0;
    (CD.Cache.daily||[]).forEach(r=>{
      if(r.country === c && (r.date||"").slice(0,7) === period) ea += (r.shipped||0);
    });
    return ea * rate;
  }
  return null;
}
function autoBasis(vendorKey, period){
  const v = V_BY_KEY[vendorKey];
  if(!v || v.mode !== "auto") return "";
  if(v.auto.item === "air"){
    let n = 0;
    (CD.Cache.shipments||[]).forEach(s=>{ if(CD.isBilledShip(s) && (s.cutoffDate||"").slice(0,7) === period) n++; });
    return `항공 ${n}건`;
  }
  const c = v.auto.country;
  const rate = ((CD.Cache.settings||{})[c] || {}).lastMile || 0;
  let ea = 0;
  (CD.Cache.daily||[]).forEach(r=>{ if(r.country === c && (r.date||"").slice(0,7) === period) ea += (r.shipped||0); });
  return `출고 ${CD.fmtNum(ea)}건 × ${fmtIn(rate, v.currency)}`;
}

/** 기간 안의 인보이스 문서 목록 (직접 입력 + 자동 계산) */
function docsIn(start, end){
  const manual = (CD.Cache.invoices||[])
    .filter(r=> r.period && r.period >= start && r.period <= end && V_BY_KEY[r.vendor])
    .map(asDoc)
    .map(d=> ({...d, auto:false}));
  const taken = {};
  manual.forEach(d=> d.lines.forEach(l=> taken[d.vendor+"|"+d.period+"|"+l.item] = true));
  const out = manual.slice();
  monthList(start, end).forEach(m=>{
    VENDORS.forEach(v=>{
      if(v.mode !== "auto") return;
      if(taken[v.key+"|"+m+"|"+v.auto.item]) return;
      const amt = autoAmount(v.key, m);
      if(amt == null || amt <= 0) return;
      out.push({ id:`auto__${v.key}__${m}`, vendor:v.key, invoiceNo:"", date:"", period:m,
                 currency:v.currency, memo:autoBasis(v.key, m), auto:true,
                 lines:[{ item:v.auto.item, amount:amt, memo:autoBasis(v.key, m) }] });
    });
  });
  return out;
}
/** 문서를 라인 단위로 펼친다 — 카드·차트·집계는 전부 이 목록을 본다 */
function linesIn(start, end){
  const out = [];
  docsIn(start, end).forEach(d=>{
    d.lines.forEach((l,i)=> out.push({
      docId:d.id, idx:i, vendor:d.vendor, period:d.period, date:d.date||"", invoiceNo:d.invoiceNo||"",
      currency:d.currency, item:l.item, amount:l.amount, memo:l.memo||"", auto:!!d.auto
    }));
  });
  return out;
}
/** 그 업체가 대응하는 국가의 월별 출고 건수 (국가가 없는 업체는 한국+일본 합계) */
function shippedByMonth(vendorKey, months){
  const v = vendorKey ? V_BY_KEY[vendorKey] : null;
  const c = v && v.auto && v.auto.country ? v.auto.country : null;
  const by = {}; months.forEach(m=> by[m] = 0);
  (CD.Cache.daily||[]).forEach(r=>{
    if(c && r.country !== c) return;
    const m = (r.date||"").slice(0,7);
    if(by[m] != null) by[m] += (r.shipped||0);
  });
  return { by, country:c };
}
function sumByVendor(start, end){
  const by = {}; VENDORS.forEach(v=> by[v.key] = 0);
  linesIn(start, end).forEach(L=>{ by[L.vendor] += dispAmt(L); });
  return by;
}

function syncControls(){
  const sEl = document.getElementById("iStart"), eEl = document.getElementById("iEnd");
  if(sEl) sEl.value = iRange.start;
  if(eEl) eEl.value = iRange.end;
  const tm = thisMonth(), lm = addMonths(tm, -1);
  let active = "";
  if(iRange.start === tm && iRange.end === tm) active = "tm";
  else if(iRange.start === lm && iRange.end === lm) active = "lm";
  else if(iRange.end === tm){
    const span = monthSpan();
    if(span === 6) active = "6";
    else if(span === 12) active = "12";
    if(iRange.start === tm.slice(0,4)+"-01") active = "ytd";
    if(iRange.start === earliestPeriod()) active = "all";
  }
  document.querySelectorAll("#iPresetSeg button").forEach(b=> b.classList.toggle("active", b.dataset.v === active));
  document.querySelectorAll("#iCurrencySeg button").forEach(b=> b.classList.toggle("active", b.dataset.v === cur));
  document.querySelectorAll("#iViewSeg button").forEach(b=> b.classList.toggle("active", b.dataset.v === viewMode));
  const vs = document.getElementById("iVendorSel");
  if(vs) vs.value = vendorFilter;
}

/* ---------------------------------------------------------------------
   렌더 — 카드와 차트
   --------------------------------------------------------------------- */
function refresh(){
  if(!built) return;
  syncControls();

  const oneVendor = vendorFilter !== "ALL" ? V_BY_KEY[vendorFilter] : null;
  const vKeys = oneVendor ? [oneVendor.key] : VENDORS.map(v=>v.key);
  const pr = prevRange();
  const curBy  = sumByVendor(iRange.start, iRange.end);
  const prevBy = sumByVendor(pr.start, pr.end);
  const docs  = docsIn(iRange.start, iRange.end).filter(d=> vKeys.indexOf(d.vendor) >= 0);
  const lines = linesIn(iRange.start, iRange.end).filter(L=> vKeys.indexOf(L.vendor) >= 0);
  const months = monthList(iRange.start, iRange.end);

  const net    = vKeys.reduce((s,k)=> s + curBy[k], 0);
  const netPrev= vKeys.reduce((s,k)=> s + prevBy[k], 0);
  const gross    = lines.filter(L=> !isDeduct(L.item)).reduce((s,L)=> s + dispGross(L), 0);
  const discount = lines.filter(L=> L.item==="discount").reduce((s,L)=> s + dispGross(L), 0);
  const credit   = lines.filter(L=> L.item==="credit").reduce((s,L)=> s + dispGross(L), 0);
  const span   = monthSpan();
  const spanTxt = `${span}개월`;

  /* ---- 요약 KPI ---- */
  const dPct = netPrev>0 ? (net-netPrev)/netPrev*100 : null;
  const dFlat = dPct!=null && Math.abs(dPct) < 0.05;
  const dCls = (dPct==null || dFlat) ? "" : (dPct<0 ? " good" : " bad");
  const dTxt = dPct==null ? `<span class="delta">직전 ${spanTxt} 비교 불가</span>`
    : `<span class="delta${dCls}">${dFlat?"":(dPct>0?"↑":"↓")}${Math.abs(dPct).toFixed(1)}%</span><span style="color:var(--muted)">직전 ${spanTxt} 대비</span>`;
  const autoN = docs.filter(d=>d.auto).length;
  document.getElementById("iKpis").innerHTML = `
    <div class="kpi">${CD.kpiIcon("money")}<div class="label">순 청구액${oneVendor?` · ${oneVendor.label}`:""}</div><div class="value">${fmtD0(net)}</div>
      <div class="sub">${dTxt}</div></div>
    <div class="kpi">${CD.kpiIcon("card","c")}<div class="label">청구 합계</div><div class="value">${fmtD0(gross)}</div>
      <div class="sub">할인·크레딧 차감 전 · ${iRange.start}~${iRange.end}</div></div>
    <div class="kpi">${CD.kpiIcon("tag","g")}<div class="label">할인</div><div class="value">${fmtD0(discount)}</div>
      <div class="sub">${lines.filter(L=>L.item==="discount").length}건 · 인보이스에서 차감</div></div>
    <div class="kpi">${CD.kpiIcon("gift","p")}<div class="label">크레딧</div><div class="value">${fmtD0(credit)}</div>
      <div class="sub">${lines.filter(L=>L.item==="credit").length}건 · 별도 차감</div></div>
    <div class="kpi">${CD.kpiIcon("calc","w")}<div class="label">월 평균</div><div class="value">${fmtD0(span>0?net/span:0)}</div>
      <div class="sub">인보이스 ${CD.fmtNum(docs.length)}건 (자동 ${CD.fmtNum(autoN)}) · 항목 ${CD.fmtNum(lines.length)}줄</div></div>
  `;
  CD.fitKpi(document.getElementById("iKpis"));

  /* ---- 업체별 카드 ---- */
  const totalAbs = VENDORS.reduce((s,v)=> s + Math.abs(curBy[v.key]), 0);
  document.getElementById("iVendorHint").textContent =
    `${iRange.start} ~ ${iRange.end} · ${sym()} 기준 · 증감은 직전 ${spanTxt}(${pr.start}~${pr.end}) 대비`;
  document.getElementById("iVendorKpis").innerHTML = VENDORS.map(v=>{
    const now = curBy[v.key], before = prevBy[v.key];
    const share = totalAbs>0 ? Math.abs(now)/totalAbs*100 : 0;
    let d = null;
    if(before>0) d = (now-before)/before*100;
    const flat = d!=null && Math.abs(d) < 0.05;
    const cls = (d==null || flat) ? "" : (d<0 ? " good" : " bad");
    const txt = d==null ? `<span class="delta">비교 불가</span>`
      : `<span class="delta${cls}">${flat?"":(d>0?"↑":"↓")}${Math.abs(d).toFixed(1)}%</span>`;
    const dim = (oneVendor && oneVendor.key!==v.key) ? ' style="opacity:.4"' : "";
    const tag = v.mode==="auto" ? `<span class="auto-tag">자동</span>` : "";
    return `<div class="kpi"${dim}>
      <div class="label"><span class="dot" style="background:var(${v.color})"></span>${v.label}${tag}</div>
      <div class="value">${fmtD0(now)}</div>
      <div class="sub">${txt}<span style="color:var(--muted)">전체의 ${share.toFixed(1)}%</span></div>
      <div style="height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;">
        <div style="height:100%; width:${share}%; background:var(${v.color}); border-radius:3px;"></div>
      </div>
    </div>`;
  }).join("");
  CD.fitKpi(document.getElementById("iVendorKpis"));

  /* ---- 추이 ---- */
  const byMonth = {};
  months.forEach(m=>{ byMonth[m] = {}; });
  lines.forEach(L=>{
    if(!byMonth[L.period]) return;
    const k = oneVendor ? L.item : L.vendor;
    byMonth[L.period][k] = (byMonth[L.period][k]||0) + dispAmt(L);
  });
  let series;
  if(oneVendor){
    const used = ITEM_ORDER.concat(DEDUCT_ITEMS).filter(k=> months.some(m=> byMonth[m][k] != null));
    series = used.map(k=>({
      key:k, label:ITEM_LABEL[k]||k, color:CD.cssVar(ITEM_COLOR[k]||"--muted"),
      values: months.map(m=> byMonth[m][k] == null ? NaN : byMonth[m][k]),
      fmt: v=> fmtD0(v)                       // 축 눈금은 축약, 툴팁은 정확한 금액
    }));
    document.getElementById("iTrendTitle").textContent = `${oneVendor.label} 항목별 추이`;
    document.getElementById("iCompTitle").textContent = `${oneVendor.label} 월별 항목 구성`;
  }else{
    series = VENDORS.map(v=>({
      key:v.key, label:v.label, color:CD.cssVar(v.color),
      values: months.map(m=> byMonth[m][v.key] == null ? NaN : byMonth[m][v.key]),
      fmt: v=> fmtD0(v)
    }));
    document.getElementById("iTrendTitle").textContent = "업체별 추이";
    document.getElementById("iCompTitle").textContent = "월별 항목 구성";
  }
  /* 출고 건수를 오른쪽 축에 겹쳐 그린다 — 비용이 물량에 비례해 움직이는지 보기 위함 */
  const shp = shippedByMonth(oneVendor ? oneVendor.key : null, months);
  const shpVals = months.map(m=> shp.by[m] || 0);
  const hasShp = shpVals.some(v=> v > 0);
  if(hasShp){
    series = series.concat([{
      key:"__shipped", label:`출고 건수${shp.country?` (${CD.COUNTRY_LABEL[shp.country]})`:""}`,
      color:CD.cssVar("--ink-2"), axis:"right", dash:true, values:shpVals,
      fmt: v=> CD.fmtNum(v)+"건"
    }]);
  }
  const shpTotal = shpVals.reduce((a,b)=>a+b,0);
  document.getElementById("iTrendHint").textContent =
    `왼쪽 축 ${sym()} 청구액 · 오른쪽 축 출고 건수${hasShp&&shpTotal>0?` · 기간 건당 ${fmtD0(net/shpTotal)}`:""}`;
  const monthNet = {};
  months.forEach(m=>{ monthNet[m] = Object.keys(byMonth[m]).reduce((t,k)=> t + byMonth[m][k], 0); });
  Charts.lineChart(document.getElementById("iTrendChart"), {
    series, labels: months.map(CD.monthLabel),
    yFmt: v=> Charts.compactMoney(sym(), v),
    y2Fmt: v=> CD.fmtNum(v),
    legend: document.getElementById("iTrendLegend"),
    // 물량 대비 단가가 그 달에 올랐는지 바로 보이도록
    tipFoot: hasShp ? (i=>{
      const m = months[i], q = shp.by[m] || 0;
      if(!q) return "";
      return `<span style="opacity:.75">출고 건당</span> <b>${fmtD0(monthNet[m]/q)}</b>`;
    }) : null
  });

  /* ---- 월별 항목 구성 ---- */
  const compIdx = {}; months.forEach((m,i)=> compIdx[m] = i);
  const compData = months.map(m=>{ const o = {date:m}; ITEM_ORDER.forEach(k=> o[k] = 0); return o; });
  lines.forEach(L=>{
    if(isDeduct(L.item)) return;
    const i = compIdx[L.period]; if(i == null) return;
    compData[i][L.item] = (compData[i][L.item]||0) + dispGross(L);
  });
  const usedKeys = ITEM_ORDER.filter(k=> compData.some(d=> (d[k]||0) > 0));
  Charts.stackedBarChart(document.getElementById("iCompChart"), {
    data: compData, keys: usedKeys.length ? usedKeys : ["other"],
    colorFn: k=> CD.cssVar(ITEM_COLOR[k]||"--muted"),
    labelFn: k=> ITEM_LABEL[k]||k,
    legend: document.getElementById("iCompLegend"),
    xLabelFn: CD.monthLabel, tipTitleFn: CD.monthLabel,
    valueFmt: v=> fmtD0(v),
    axisFmt: v=> Charts.compactMoney(sym(), v)
  });

  /* ---- 한 업체를 골랐을 때만: 항목별 합계 카드 ---- */
  const itemSec = document.getElementById("iItemSection");
  if(oneVendor){
    itemSec.hidden = false;
    const prevLines = linesIn(pr.start, pr.end).filter(L=> L.vendor === oneVendor.key);
    const nowByItem = {}, prevByItem = {};
    lines.forEach(L=>{ nowByItem[L.item] = (nowByItem[L.item]||0) + dispAmt(L); });
    prevLines.forEach(L=>{ prevByItem[L.item] = (prevByItem[L.item]||0) + dispAmt(L); });
    const keys = ITEM_ORDER.concat(DEDUCT_ITEMS).filter(k=> nowByItem[k] != null || prevByItem[k] != null);
    const itemTotal = keys.reduce((s,k)=> s + Math.abs(nowByItem[k]||0), 0);
    document.getElementById("iItemTitle").textContent = `${oneVendor.label} 항목별 합계`;
    document.getElementById("iItemHint").textContent =
      `${iRange.start} ~ ${iRange.end} · ${sym()} 기준 · 증감은 직전 ${spanTxt} 대비`;
    const host = document.getElementById("iItemKpis");
    host.innerHTML = keys.map(k=>{
      const now = nowByItem[k]||0, before = prevByItem[k]||0;
      const share = itemTotal>0 ? Math.abs(now)/itemTotal*100 : 0;
      let d = null; if(before>0) d = (now-before)/before*100;
      const flat = d!=null && Math.abs(d) < 0.05;
      const cls = (d==null || flat) ? "" : (d<0 ? " good" : " bad");
      const txt = d==null ? `<span class="delta">비교 불가</span>`
        : `<span class="delta${cls}">${flat?"":(d>0?"↑":"↓")}${Math.abs(d).toFixed(1)}%</span>`;
      return `<div class="kpi">
        <div class="label"><span class="dot" style="background:var(${ITEM_COLOR[k]||"--muted"})"></span>${ITEM_LABEL[k]||k}</div>
        <div class="value">${fmtD0(now)}</div>
        <div class="sub">${txt}<span style="color:var(--muted)">${isDeduct(k)?"차감":`전체의 ${share.toFixed(1)}%`}</span></div>
        <div style="height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;">
          <div style="height:100%; width:${share}%; background:var(${ITEM_COLOR[k]||"--muted"}); border-radius:3px;"></div>
        </div>
      </div>`;
    }).join("") || `<div class="card"><div class="empty-note">이 기간에 ${oneVendor.label} 청구 내역이 없습니다.</div></div>`;
    if(keys.length){
      const fill = (4 - (keys.length % 4)) % 4;
      for(let i=0;i<fill;i++) host.insertAdjacentHTML("beforeend", `<div class="kpi"></div>`);
    }
    CD.fitKpi(host);
  }else{
    itemSec.hidden = true;
  }

  lastDocs = docs;
  lastLines = lines;
  renderTable();
}

/* ---------------------------------------------------------------------
   렌더 — 청구 내역 표 (인보이스별 / 날짜별 / 항목별)
   --------------------------------------------------------------------- */
function vLabel(k){ return (V_BY_KEY[k]||{}).label || k; }
function vDot(k){ return `<span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:var(${(V_BY_KEY[k]||{}).color||"--muted"}); margin-right:6px;"></span>`; }
/** 최신순 정렬 키. 날짜가 없는 건(자동 계산 등)은 같은 달 안에서 날짜 있는 건 뒤로 */
function sortKey(d){ return (d.date || (d.period+"-00")) + "|" + d.vendor; }
function docMatches(d){
  if(!q) return true;
  const fields = [vLabel(d.vendor), d.invoiceNo, d.date, d.period, d.memo]
    .concat(d.lines.map(l=> ITEM_LABEL[l.item]||l.item))
    .concat(d.lines.map(l=> l.memo||""));
  return CD.matchQuery.apply(null, [q].concat(fields));
}

function renderTable(){
  const head = document.getElementById("iTableHead");
  const body = document.getElementById("iTableBody");
  if(!body) return;
  document.getElementById("iExpandBtn").hidden = (viewMode === "item");

  const docs = lastDocs.filter(docMatches).sort((a,b)=> sortKey(a) < sortKey(b) ? 1 : -1);
  const total = docs.reduce((s,d)=> s + docDispTotal(d), 0);
  const lineCount = docs.reduce((s,d)=> s + d.lines.length, 0);
  document.getElementById("iTableHint").textContent =
    `인보이스 ${CD.fmtNum(docs.length)}건 · 항목 ${CD.fmtNum(lineCount)}줄 · 합계 ${fmtD0(total)}`;

  if(viewMode === "item") renderItemView(head, body, docs);
  else if(viewMode === "date") renderDateView(head, body, docs);
  else renderInvoiceView(head, body, docs);
  wireRowActions(body);
}

/** 한 줄 = 한 항목 (예전 방식) */
function renderItemView(head, body, docs){
  head.innerHTML = `<tr>
    <th class="text">날짜</th><th class="text">귀속 월</th><th class="text">업체</th><th class="text">항목</th>
    <th class="num">청구 금액</th><th class="num">환산</th>
    <th class="text">인보이스 번호</th><th class="text">메모 · 근거</th><th class="text"></th>
  </tr>`;
  const rows = [];
  docs.forEach(d=> d.lines.forEach(l=> rows.push({doc:d, line:l})));
  const pages = Math.max(1, Math.ceil(rows.length/15));
  if(page >= pages) page = pages-1;
  if(page < 0) page = 0;
  const shown = rows.slice(page*15, (page+1)*15);
  CD.renderPager(document.getElementById("iPager"), {
    total: rows.length, page, perPage: 15, onGo: n=>{ page = n; renderTable(); }
  });
  body.innerHTML = shown.map(({doc:d, line:l})=>{
    const L = {...l, currency:d.currency};
    const neg = isDeduct(l.item);
    return `<tr>
      <td class="text mono">${d.date || `<span style="color:var(--muted)">-</span>`}</td>
      <td class="text mono">${d.period}</td>
      <td class="text">${vDot(d.vendor)}${vLabel(d.vendor)}</td>
      <td class="text">${ITEM_LABEL[l.item]||l.item}${d.auto?`<span class="auto-tag">자동</span>`:""}</td>
      <td class="num mono"${neg?' style="color:var(--good-ink)"':''}>${neg?"-":""}${fmtIn(l.amount, d.currency)}</td>
      <td class="num mono"${neg?' style="color:var(--good-ink)"':''}>${fmtD0(dispAmt(L))}</td>
      <td class="text mono">${d.invoiceNo||"-"}</td>
      <td class="text" style="${d.auto?"color:var(--muted)":""}">${l.memo||d.memo||""}</td>
      <td class="text">
        <button class="btn small ghost" data-edit="${d.id}">${d.auto?"직접 입력":"수정"}</button>
        ${d.auto?"":`<button class="btn small danger ghost" data-del="${d.id}">삭제</button>`}
      </td>
    </tr>`;
  }).join("") ||
    `<tr><td colspan="9" class="text empty-note">${lastDocs.length ? "검색 결과가 없습니다." : "이 기간에 청구 내역이 없습니다."}</td></tr>`;
}

function wireRowActions(body){
  body.querySelectorAll("tr.doc-row").forEach(tr=>{
    tr.addEventListener("click", e=>{
      if(e.target.closest("button")) return;
      const id = tr.dataset.doc;
      openDocs[id] = !openDocs[id];
      renderTable();
    });
  });
  body.querySelectorAll("[data-edit]").forEach(b=>{
    b.addEventListener("click", e=>{
      e.stopPropagation();
      const d = lastDocs.find(x=>x.id===b.dataset.edit);
      if(!d) return;
      if(!d.auto && d.lines.length===1 && d.lines[0].item==="credit") openCredit(d);
      else openForm(d);
    });
  });
  body.querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click", async e=>{
      e.stopPropagation();
      const d = lastDocs.find(x=>x.id===b.dataset.del);
      if(!d) return;
      const what = d.invoiceNo ? `인보이스 ${d.invoiceNo}` : `${d.period} · ${vLabel(d.vendor)}`;
      if(!confirm(`${what} (항목 ${d.lines.length}개) 를 삭제할까요?`)) return;
      await CD.Store.deleteInvoice(d.id);
    });
  });
}

/* ---------------------------------------------------------------------
   인보이스 입력 모달 — 한 장에 여러 항목
   --------------------------------------------------------------------- */
function closeForm(){ overlay.hidden = true; modalBody.className = "modal"; modalBody.innerHTML = ""; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function itemOptions(vendorKey, selected){
  return itemsFor(vendorKey).map(k=>
    `<option value="${k}"${k===selected?" selected":""}>${ITEM_LABEL[k]}</option>`).join("");
}

function openForm(doc){
  const isAuto = !!(doc && doc.auto);
  editingId = (doc && !isAuto) ? doc.id : null;
  const vk = doc ? doc.vendor : VENDORS[0].key;
  const v = V_BY_KEY[vk];
  // 자동 계산 건을 덮어쓸 땐 그 금액을 첫 줄에 채워 준다
  const all = doc ? doc.lines.map(l=>({ item:l.item, amount: isAuto ? Math.round((l.amount||0)*100)/100 : l.amount, memo:l.memo||"" }))
                  : [{ item:itemsFor(vk)[0], amount:"", memo:"" }];

  let lines = all.filter(l=> l.item !== "discount");
  let discs = all.filter(l=> l.item === "discount").map(l=>({ amount:l.amount, memo:l.memo||"" }));

        </div>
        <div class="field"><label>인보이스 날짜</label>
          <input type="date" id="ivDate" class="mono" value="${doc && !isAuto ? esc(doc.date) : CD.todayISO()}">
        </div>
        <div class="field"><label>귀속 월 (집계 기준)</label>
          <input type="month" id="ivPeriod" class="mono" value="${doc ? doc.period : thisMonth()}" required>
        </div>
        <div class="field"><label>통화</label>
          <select id="ivCur">
            ${["USD","KRW","JPY"].map(c=>`<option value="${c}"${c===(doc?doc.currency:v.currency)?" selected":""}>${c}</option>`).join("")}
