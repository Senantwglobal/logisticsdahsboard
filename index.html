          <div class="table-wrap">
            <table style="min-width:0;">
              <thead><tr><th>날짜</th><th>명칭</th><th>등록</th><th>근무</th><th></th></tr></thead>
              <tbody id="hTableBody"></tbody>
            </table>
          </div>
          <div class="pager" id="hPager"></div>
        </div>
      </div>
    </div>
  `;

  document.getElementById("hCountrySeg").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    country = b.dataset.v;
    [...b.parentElement.children].forEach(c=>c.classList.toggle("active", c===b));
    refresh();
  });
  document.getElementById("hSearch").addEventListener("input", e=>{ hQ = e.target.value; hPage = 0; refresh(); });
  document.getElementById("hPrev").addEventListener("click", ()=>{ cursor.m--; if(cursor.m<0){cursor.m=11;cursor.y--;} refresh(); });
  document.getElementById("hNext").addEventListener("click", ()=>{ cursor.m++; if(cursor.m>11){cursor.m=0;cursor.y++;} refresh(); });
  let formClosed = true; // 창고 휴무(true) vs 정상 근무(false) for the "휴무일 추가" form
  document.getElementById("hClosedSeg").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    formClosed = b.dataset.v==="1";
    [...b.parentElement.children].forEach(c=>c.classList.toggle("active", c===b));
  });
  document.getElementById("hForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const date = document.getElementById("hDate").value;
    const name = document.getElementById("hName").value.trim();
    if(!date || !name) return;
    await CD.Store.upsertHoliday({ id:`${country}_${date}`, country, date, name, source:"custom", closed: formClosed });
    document.getElementById("hForm").reset();
    document.getElementById("hDate").value = CD.todayISO();
    formClosed = true;
    document.getElementById("hClosedSeg").querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.v==="1"));
  });
  document.getElementById("hReseed").addEventListener("click", async ()=>{
    const seedRows = HOLIDAY_SEED_REF.filter(r=>r[0]===country);
    for(const [c,date,name] of seedRows){
      await CD.Store.upsertHoliday({ id:`${c}_${date}`, country:c, date, name, source:"auto", closed:true });
    }
    alert(`${CD.COUNTRY_LABEL[country]} 공휴일을 다시 불러왔습니다.`);
  });

  document.getElementById("hDate").value = CD.todayISO();
  built = true;
}

function renderDow(){
  const el = document.getElementById("hCalDow");
  el.innerHTML = ["일","월","화","수","목","금","토"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
}

function refresh(){
  if(!built) return;
  renderDow();
  document.getElementById("hMonthLabel").textContent = `${cursor.y}.${CD.pad2(cursor.m+1)}`;

  const list = CD.Cache.holidays.filter(h=>h.country===country);
  const map = {}; list.forEach(h=> map[h.date]=h);

  const first = new Date(cursor.y, cursor.m, 1);
  const startOffset = first.getDay();
  const dim = CD.daysInMonth(cursor.y, cursor.m);
  const prevDim = CD.daysInMonth(cursor.m===0?cursor.y-1:cursor.y, cursor.m===0?11:cursor.m-1);
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push({out:true, day: prevDim-startOffset+1+i});
  for(let d=1; d<=dim; d++) cells.push({out:false, day:d, iso: `${cursor.y}-${CD.pad2(cursor.m+1)}-${CD.pad2(d)}`});
  { let nd=1; while(cells.length%7!==0) cells.push({out:true, day: nd++}); }
  const today = CD.todayISO();

  document.getElementById("hCalGrid").innerHTML = cells.map((c,idx)=>{
    if(c.out) return `<div class="cal-cell out"><div class="d">${c.day}</div></div>`;
    const wd = idx%7;
    const h = map[c.iso];
    const isToday = c.iso===today;
    const isClosed = h ? (h.closed!==false) : false;
    return `<div class="cal-cell ${isToday?'today':''}">
      <div class="d ${wd===0||wd===6?'weekend':''}">${c.day}</div>
      ${h?`<div class="holi ${isClosed?'':'open'}">${h.name}${isClosed?'':' · 정상근무'}</div>`:''}
    </div>`;
  }).join("");

  const allList = [...list].sort((a,b)=>a.date<b.date?-1:1);
  const sorted = allList.filter(h=> CD.matchQuery(hQ, h.name, h.date));
  const hPages = Math.max(1, Math.ceil(sorted.length/H_PER));
  if(hPage >= hPages) hPage = hPages-1;
  document.getElementById("hCount").textContent =
    sorted.length===allList.length ? `${allList.length}건` : `${sorted.length}건 / 전체 ${allList.length}건`;
  CD.renderPager(document.getElementById("hPager"), {
    total: sorted.length, page: hPage, perPage: H_PER, onGo: n=>{ hPage = n; refresh(); }
  });
  document.getElementById("hTableBody").innerHTML = sorted.slice(hPage*H_PER, (hPage+1)*H_PER).map(h=>{
    const isClosed = h.closed!==false;
    return `
    <tr>
      <td style="white-space:normal; min-width:74px;">${CD.fmtShort(h.date)}</td>
      <td class="text" style="white-space:normal; min-width:90px;">${h.name}</td>
      <td class="text"><span class="badge ${h.source==='auto'?'auto':'good'}">${h.source==='auto'?'자동':'수동'}</span></td>
      <td class="text"><button class="badge ${isClosed?'critical':'good'}" style="appearance:none; border:none; font-family:inherit; cursor:pointer; white-space:nowrap;" data-toggle="${h.id}" title="눌러서 전환">${isClosed?'휴무':'정상 근무'}</button></td>
      <td class="text"><button class="btn small danger ghost" data-del="${h.id}">삭제</button></td>
    </tr>
  `;
  }).join("") || `<tr><td colspan="5" class="text empty-note">등록된 휴무일이 없습니다.</td></tr>`;

  document.getElementById("hTableBody").querySelectorAll("[data-toggle]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const h = sorted.find(x=>x.id===b.dataset.toggle); if(!h) return;
      const nowClosed = h.closed!==false;
      await CD.Store.upsertHoliday({ id:h.id, country:h.country, date:h.date, name:h.name, source:h.source, closed: !nowClosed });
    });
  });
  document.getElementById("hTableBody").querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click", async ()=>{ if(confirm("이 휴무일을 삭제할까요?")) await CD.Store.deleteHoliday(b.dataset.del); });
  });
}

const HOLIDAY_SEED_REF = window.__CD_HOLIDAY_SEED__;

CD.on("holidays", refresh);
CD.on("tab", t=>{ if(t==="holidays") refresh(); });
CD.on("ready", ()=>{ shell(); refresh(); });
})();
</script>

<script>
/* =====================================================================
   FLIGHTS & CUTOFF TAB
   ===================================================================== */
(function(){
"use strict";
const CD = window.CD;
const root = document.getElementById("view-flights");
let built = false;
let filterCountry = "ALL";
let cursor = { y: Number(CD.todayISO().slice(0,4)), m: Number(CD.todayISO().slice(5,7))-1 };
const overlay = document.getElementById("modalOverlay");
const modalBody = document.getElementById("modalBody");

function closeModal(){ overlay.hidden = true; modalBody.innerHTML=""; }
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });

function fieldRow(label, inputHtml, full){
  return `<div class="field ${full?'full':''}"><label>${label}</label>${inputHtml}</div>`;
}

function openForm(existing){
  const s = existing || { country:filterCountry==="JP"?"JP":"KR", cutoffDate: CD.todayISO(), cutoffTime:"15:00" };
  modalBody.innerHTML = `
    <div class="modal-head"><h3>${existing? "항공편 · 컷오프 수정" : "항공편 · 컷오프 등록"}</h3><button class="close-x" id="mClose">&times;</button></div>
    <form id="mForm">
      <div class="grid form">
        ${fieldRow("국가", `<select id="mCountry"><option value="KR" ${s.country==='KR'?'selected':''}>한국</option><option value="JP" ${s.country==='JP'?'selected':''}>일본</option></select>`)}
        <div></div>
        ${fieldRow("컷오프 날짜 (ETD 전날)", `<input type="date" id="mCutoffDate" value="${s.cutoffDate||''}" required>`)}
        ${fieldRow("컷오프 시간", `<input type="time" id="mCutoffTime" value="${s.cutoffTime||''}">`)}
        ${fieldRow("항공사", `<select id="mCarrierSel"></select>`)}
        ${fieldRow("편명 (FLT)", `<select id="mFlightSel"></select>`)}
        ${fieldRow("항공사명 (직접 입력)", `<input type="text" id="mCarrier" value="${s.carrier||''}" placeholder="예: Asiana Cargo">`)}
        ${fieldRow("편명 (직접 입력)", `<input type="text" id="mFlightNo" class="mono" value="${s.flightNo||''}" placeholder="예: OZ983">`)}
        ${fieldRow("출발지 (Origin)", `<input type="text" id="mOrigin" class="mono" value="${s.origin||''}" placeholder="ICN">`)}
        ${fieldRow("도착지 (Dest)", `<input type="text" id="mDest" class="mono" value="${s.dest||''}" placeholder="LAX">`)}
        ${fieldRow("ETD", `<input type="datetime-local" id="mEtd" value="${(s.etd||'').slice(0,16)}">`)}
        ${fieldRow("ETA", `<input type="datetime-local" id="mEta" value="${(s.eta||'').slice(0,16)}">`)}
        ${fieldRow("MAWB", `<input type="text" id="mMawb" class="mono" value="${s.mawb||''}" placeholder="988-1234 5670">`, true)}
        ${fieldRow("Pallet Count", `<input type="number" id="mPallet" min="0" value="${s.palletCount||0}">`)}
        ${fieldRow("Package Count", `<input type="number" id="mPackage" min="0" value="${s.packageCount||0}">`)}
        ${fieldRow("Cutoff Weight (kg)", `<input type="number" id="mCutoffWeight" min="0" value="${s.cutoffWeight||0}">`)}
        ${fieldRow("Actual Weight (kg)", `<input type="number" id="mActualWeight" min="0" value="${s.actualWeight||0}">`)}
        ${fieldRow("부피무게 Volume Weight (kg)", `<input type="number" id="mVolumeWeight" min="0" value="${s.volumeWeight||0}">`, true)}
        ${fieldRow("비고", `<textarea id="mNotes" rows="2" style="width:100%;">${s.notes||''}</textarea>`, true)}
      </div>
      <div class="modal-foot">
        ${existing? `<button type="button" class="btn danger" id="mDelete">삭제</button>` : ""}
        <button type="button" class="btn ghost" id="mCancel">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  `;
  overlay.hidden = false;
  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mCancel").addEventListener("click", closeModal);

  /* ---- 등록해둔 항공편에서 골라 자동 입력 (값은 이후 자유롭게 수정 가능) ---- */
  const carrierSel = document.getElementById("mCarrierSel");
  const flightSel  = document.getElementById("mFlightSel");
  function activeCargo(){ return (CD.Cache.cargo||[]).filter(c=> c.enabled !== false); }
  function fillCarrierSel(){
    const names = [...new Set(activeCargo().map(c=>c.carrier).filter(Boolean))].sort();
    carrierSel.innerHTML = `<option value="">직접 입력</option>` +
      names.map(n=>`<option value="${n}" ${s.carrier===n?'selected':''}>${n}</option>`).join("");
  }
  function fillFlightSel(){
    const list = activeCargo().filter(c=> !carrierSel.value || c.carrier===carrierSel.value);
    flightSel.innerHTML = `<option value="">직접 입력</option>` +
      list.map(c=>`<option value="${c.id}" ${s.flightNo===c.flightNo?'selected':''}>${c.flightNo} (${c.origin||'-'}→${c.dest||'-'})</option>`).join("");
  }
  /* 컷오프 날짜는 항상 ETD 전날이다. 한쪽을 고치면 반대쪽이 따라오고, ETA는 기존 간격을 유지한다. */
  /** ETD가 prev → next로 옮겨간 만큼 ETA도 같이 민다 (간격이 비정상이면 +1일로 본다) */
  function shiftEta(prev, next){
    const etaEl = document.getElementById("mEta");
    if(!etaEl.value || !prev || !next) return;
    let gap = Math.round((CD.parseISO(etaEl.value.slice(0,10)) - CD.parseISO(prev.slice(0,10))) / 86400000);
    if(!isFinite(gap) || gap < 0 || gap > 3) gap = 1;
    etaEl.value = `${CD.addDays(next.slice(0,10), gap)}T${etaEl.value.slice(11) || "00:00"}`;
  }
  /** ETD를 바꾸면서 컷오프·ETA를 한 번에 맞춘다 */
  function setEtd(value){
    const el = document.getElementById("mEtd");
    const prev = el.dataset.prev || el.value;
    el.value = value;
    el.dataset.prev = value;
    if(value && value.length >= 10){
      document.getElementById("mCutoffDate").value = CD.addDays(value.slice(0,10), -1);
      shiftEta(prev, value);
    }
  }
  function syncFromCutoff(){
    const cut = document.getElementById("mCutoffDate").value;
    const el = document.getElementById("mEtd");
    if(!cut) return;
    setEtd(`${CD.addDays(cut, 1)}T${(el.value.slice(11) || "00:00")}`);
  }
  function syncFromEtd(){
    const el = document.getElementById("mEtd");
    if(!el.value || el.value.length < 10) return;
    setEtd(el.value);
  }

  /** Apply a preset to the form: carrier/flight/route always, ETD/ETA built from the cutoff date. */
  function applyCargo(rec){
    if(!rec) return;
    document.getElementById("mCarrier").value = rec.carrier || "";
    document.getElementById("mFlightNo").value = rec.flightNo || "";
    if(rec.origin) document.getElementById("mOrigin").value = rec.origin;
    if(rec.dest) document.getElementById("mDest").value = rec.dest;
    if(rec.country) document.getElementById("mCountry").value = rec.country;
    const cut = document.getElementById("mCutoffDate").value || CD.todayISO();
    const dep = CD.addDays(cut, 1);                       // 컷오프 다음날 출발
    if(rec.etd){
      const el = document.getElementById("mEtd");
      el.value = `${dep}T${rec.etd}`;
      el.dataset.prev = el.value;
    }
    if(rec.eta){
      // 도착 시각이 출발보다 이르면 다음날 도착
      const arr = (rec.etd && rec.eta < rec.etd) ? CD.addDays(dep,1) : dep;
      document.getElementById("mEta").value = `${arr}T${rec.eta}`;
    }
  }
  document.getElementById("mEtd").dataset.prev = document.getElementById("mEtd").value || "";
  document.getElementById("mCutoffDate").addEventListener("change", syncFromCutoff);
  document.getElementById("mEtd").addEventListener("change", syncFromEtd);
  fillCarrierSel(); fillFlightSel();
  carrierSel.addEventListener("change", ()=>{
    fillFlightSel();
    const list = activeCargo().filter(c=>c.carrier===carrierSel.value);
    if(list.length===1){ flightSel.value = list[0].id; applyCargo(list[0]); }
    else if(carrierSel.value){ document.getElementById("mCarrier").value = carrierSel.value; }
  });
  flightSel.addEventListener("change", ()=>{
    applyCargo(activeCargo().find(c=>c.id===flightSel.value));
  });
  if(existing){
    document.getElementById("mDelete").addEventListener("click", async ()=>{
      if(confirm("이 항공편 · 컷오프 정보를 삭제할까요?")){ await CD.Store.deleteShipment(existing.id); closeModal(); }
    });
  }
  document.getElementById("mForm").addEventListener("submit", async e=>{
    e.preventDefault();
    syncFromEtd();                               // ETD가 있으면 컷오프는 무조건 그 전날로 맞춘다
    const data = {
      country: document.getElementById("mCountry").value,
      cutoffDate: document.getElementById("mCutoffDate").value,
      cutoffTime: document.getElementById("mCutoffTime").value,
      carrier: document.getElementById("mCarrier").value.trim(),
      flightNo: document.getElementById("mFlightNo").value.trim(),
      origin: document.getElementById("mOrigin").value.trim().toUpperCase(),
      dest: document.getElementById("mDest").value.trim().toUpperCase(),
      etd: document.getElementById("mEtd").value,
      eta: document.getElementById("mEta").value,
      mawb: document.getElementById("mMawb").value.trim(),
      palletCount: Number(document.getElementById("mPallet").value)||0,
      packageCount: Number(document.getElementById("mPackage").value)||0,
      cutoffWeight: Number(document.getElementById("mCutoffWeight").value)||0,
      actualWeight: Number(document.getElementById("mActualWeight").value)||0,
      volumeWeight: Number(document.getElementById("mVolumeWeight").value)||0,
      notes: document.getElementById("mNotes").value.trim(),
    };
    if(existing){ await CD.Store.updateShipment(existing.id, data); }
    else { data.createdAt = Date.now(); await CD.Store.addShipment(data); }
    closeModal();
  });
}

    <div class="section grid master" id="cargoSection">

            <div class="field"><label>도착지</label><input type="text" id="cgDest" class="mono" placeholder="LAX"></div>

  document.getElementById("sCountrySeg").addEventListener("click", e=>{

    refresh();
  });
  document.getElementById("sAddBtn").addEventListener("click", ()=>openForm(null));
  document.getElementById("sSearch").addEventListener("input", e=>{ listQ = e.target.value; listPage = 0; refresh(); });

    document.getElementById("sSearch").value="";
    document.getElementById("sListCountry").querySelectorAll("button").forEach(b=>b.classList.toggle("active", b.dataset.v==="ALL"));

  document.getElementById("sPrev").addEventListener("click", ()=>{ cursor.m--; if(cursor.m<0){cursor.m=11;cursor.y--;} refresh(); });

  // ---- 항공편 마스터 등록/수정 ----

    const carrier = document.getElementById("cgCarrier").value.trim();

      id: editingCargoId || `cg_${carrier.replace(/\s+/g,"").toUpperCase()}_${flightNo}`,
      country: document.getElementById("cgCountry").value,
      carrier, flightNo,

    };
    await CD.Store.upsertCargo(rec);
    resetCargoForm();

}

function fmtDT(v){
  if(!v) return "-";
  const s = String(v).replace("T"," ");
  const out = s.slice(5,16);
  return out.endsWith(" 00:00") ? out.slice(0,-6) : out;   // 시간 정보가 없는 건은 날짜만
}

/* ---------------- 항공편 마스터(CARGO) ---------------- */
let editingCargoId = null;
/* 목록 필터 상태 — 건수가 수백 건이라 검색 · 월 · 국가 · 페이지로 좁혀서 본다 */
let listQ = "", listYear = "", listMonth = "", listCountry = "ALL", listPage = 0;
const LIST_PER = 25;
function resetCargoForm(){
  editingCargoId = null;
  const f = document.getElementById("cgForm"); if(!f) return;
  f.reset();
  document.getElementById("cgSubmit").textContent = "등록";
  document.getElementById("cgCancel").hidden = true;
}
function loadCargoIntoForm(rec){
  editingCargoId = rec.id;
  document.getElementById("cgCountry").value = rec.country || "KR";
  document.getElementById("cgCarrier").value = rec.carrier || "";
  document.getElementById("cgFlightNo").value = rec.flightNo || "";
  document.getElementById("cgOrigin").value = rec.origin || "";
  document.getElementById("cgDest").value = rec.dest || "";
  document.getElementById("cgEtd").value = rec.etd || "";
  document.getElementById("cgEta").value = rec.eta || "";
  document.getElementById("cgDirect").value = rec.direct || "Direct";
  document.getElementById("cgSubmit").textContent = "수정 저장";
  document.getElementById("cgCancel").hidden = false;
}
function renderCargo(){
  const body = document.getElementById("cgTableBody"); if(!body) return;
  const list = CD.Cache.cargo || [];
  document.getElementById("cgCount").textContent = `${list.length}편`;
  body.innerHTML = list.map(c=>{
    const on = c.enabled !== false;
    return `<tr>
      <td class="text">
        <div style="color:var(--muted); font-size:11px;">${c.flightNo||''} · ${c.direct||'Direct'}</div>
        <div><span class="badge ${(c.country||'KR').toLowerCase()}">${CD.COUNTRY_LABEL[c.country||'KR']}</span> ${c.carrier||''}</div>
      </td>
      <td>${c.origin||'-'} → ${c.dest||'-'}</td>
      <td>${c.etd||'-'}</td>
      <td>${c.eta||'-'}</td>
      <td class="text"><button class="badge ${on?'good':'sample'}" style="appearance:none; border:none; font-family:inherit; cursor:pointer;" data-cgtoggle="${c.id}">${on?'ON':'OFF'}</button></td>
      <td class="text" style="white-space:nowrap;">
        <button class="btn small ghost" data-cgedit="${c.id}">수정</button>
        <button class="btn small danger ghost" data-cgdel="${c.id}">삭제</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" class="text empty-note">등록된 항공편이 없습니다.</td></tr>`;

  body.querySelectorAll("[data-cgedit]").forEach(b=> b.addEventListener("click", ()=>{
    const rec = CD.Cache.cargo.find(x=>x.id===b.dataset.cgedit); if(rec) loadCargoIntoForm(rec);
  }));
  body.querySelectorAll("[data-cgdel]").forEach(b=> b.addEventListener("click", async ()=>{
    if(confirm("이 항공편을 목록에서 삭제할까요?")){ await CD.Store.deleteCargo(b.dataset.cgdel); if(editingCargoId===b.dataset.cgdel) resetCargoForm(); }
  }));
  body.querySelectorAll("[data-cgtoggle]").forEach(b=> b.addEventListener("click", async ()=>{
    const rec = CD.Cache.cargo.find(x=>x.id===b.dataset.cgtoggle); if(!rec) return;
    await CD.Store.upsertCargo({ ...rec, enabled: rec.enabled === false });
  }));
}

function refresh(){
  if(!built) return;
  document.getElementById("sCalDow").innerHTML = ["일","월","화","수","목","금","토"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
  document.getElementById("sMonthLabel").textContent = `${cursor.y}.${CD.pad2(cursor.m+1)}`;

  const all = CD.Cache.shipments.filter(s=> filterCountry==="ALL" || s.country===filterCountry);
  const byDate = {};
  all.forEach(s=>{ (byDate[s.cutoffDate] = byDate[s.cutoffDate]||[]).push(s); });

  const first = new Date(cursor.y, cursor.m, 1);
  const startOffset = first.getDay();
  const dim = CD.daysInMonth(cursor.y, cursor.m);
  const prevDim = CD.daysInMonth(cursor.m===0?cursor.y-1:cursor.y, cursor.m===0?11:cursor.m-1);
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push({out:true, day: prevDim-startOffset+1+i});
  for(let d=1; d<=dim; d++) cells.push({out:false, day:d, iso: `${cursor.y}-${CD.pad2(cursor.m+1)}-${CD.pad2(d)}`});
  { let nd=1; while(cells.length%7!==0) cells.push({out:true, day: nd++}); }
  const today = CD.todayISO();

  document.getElementById("sCalGrid").innerHTML = cells.map((c,idx)=>{
    if(c.out) return `<div class="cal-cell out"><div class="d">${c.day}</div></div>`;
    const wd = idx%7;
    const items = byDate[c.iso]||[];
    const shown = items.slice(0,3);
    const isToday = c.iso===today;
    return `<div class="cal-cell ${isToday?'today':''}">
      <div class="d ${wd===0||wd===6?'weekend':''}">${c.day}</div>
      ${shown.map(s=>`<div class="chip ${s.country.toLowerCase()}" data-open="${s.id}">${s.flightNo||CD.COUNTRY_LABEL[s.country]}</div>`).join("")}
      ${items.length>3?`<div class="cal-cell-more" data-more="${c.iso}">+${items.length-3}건 더보기</div>`:''}
    </div>`;
  }).join("");

  document.getElementById("sCalGrid").querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const rec = all.find(s=>s.id===el.dataset.open); if(rec) openForm(rec);
    });
  });
  document.getElementById("sCalGrid").querySelectorAll("[data-more]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const items = byDate[el.dataset.more]||[];
      alert(items.map(s=>`${CD.COUNTRY_LABEL[s.country]} · ${s.carrier||''} ${s.flightNo||''}`).join("\n"));
    });
  });

  const sorted = [...all].sort((a,b)=> (a.cutoffDate+((a.cutoffTime)||'')) < (b.cutoffDate+((b.cutoffTime)||'')) ? -1:1);
  // 연도 · 월 선택지 채우기 (데이터에 실제로 있는 것만)
  const yearSel = document.getElementById("sYear");
  const monthSel = document.getElementById("sMonth");
  const allDates = all.map(x=>x.cutoffDate||"").filter(Boolean);
  const years = [...new Set(allDates.map(d=>d.slice(0,4)))].sort().reverse();
  const yearOpts = `<option value="">전체 연도</option>` + years.map(y=>`<option value="${y}">${y}년</option>`).join("");
  if(yearSel.innerHTML !== yearOpts) yearSel.innerHTML = yearOpts;
  yearSel.value = listYear;

  const monthsIn = [...new Set(allDates.filter(d=>!listYear || d.slice(0,4)===listYear).map(d=>d.slice(5,7)))].sort();
  if(listMonth && !monthsIn.includes(listMonth)) listMonth = "";   // 연도를 바꿔 해당 월이 없어지면 해제
  const monthOpts = `<option value="">전체 월</option>` + monthsIn.map(m=>`<option value="${m}">${Number(m)}월</option>`).join("");
  if(monthSel.innerHTML !== monthOpts) monthSel.innerHTML = monthOpts;
  monthSel.value = listMonth;

  const filtered = sorted.filter(x=>
       (listCountry==="ALL" || x.country===listCountry)
    && (!listYear  || (x.cutoffDate||"").slice(0,4)===listYear)
    && (!listMonth || (x.cutoffDate||"").slice(5,7)===listMonth)
    && CD.matchQuery(listQ, x.mawb, x.flightNo, x.carrier, x.origin, x.dest, x.cutoffDate)
  );
  const pageCount = Math.max(1, Math.ceil(filtered.length/LIST_PER));
  if(listPage >= pageCount) listPage = pageCount-1;
  const shown = filtered.slice(listPage*LIST_PER, (listPage+1)*LIST_PER);

  document.getElementById("sCount").textContent =
    filtered.length===all.length ? `${all.length}건` : `${filtered.length}건 / 전체 ${all.length}건`;
  CD.renderPager(document.getElementById("sPager"), {
    total: filtered.length, page: listPage, perPage: LIST_PER,
    onGo: n=>{ listPage = n; refresh(); }
  });
  document.getElementById("sTableBody").innerHTML = shown.map(s=>`
    <tr>
      <td>${CD.fmtShort(s.cutoffDate)} ${s.cutoffTime||''}</td>
      <td class="text"><span class="badge ${s.country.toLowerCase()}">${CD.COUNTRY_LABEL[s.country]}</span></td>
      <td class="text">${s.carrier||'-'} <span class="mono">${s.flightNo||''}</span>${s.isSample?' <span class="badge sample">예시</span>':''}</td>
      <td class="text">${s.origin||'-'}→${s.dest||'-'}</td>
      <td>${fmtDT(s.etd)}</td>
      <td>${fmtDT(s.eta)}</td>
      <td class="text">${s.mawb||'-'}</td>
      <td>${CD.fmtNum(s.palletCount||0)}</td>
      <td>${CD.fmtNum(s.packageCount||0)}</td>
      <td>${CD.fmtNum(s.cutoffWeight||0)}</td>
      <td>${CD.fmtNum(s.actualWeight||0)}</td>
      <td>${CD.fmtNum(s.volumeWeight||0)}</td>
      <td class="text"><button class="btn small ghost" data-edit="${s.id}">수정</button></td>
    </tr>
  `).join("") || `<tr><td colspan="13" class="text empty-note">${all.length? "조건에 맞는 항공편이 없습니다." : "등록된 항공편 · 컷오프가 없습니다."}</td></tr>`;

  document.getElementById("sTableBody").querySelectorAll("[data-edit]").forEach(b=>{
    b.addEventListener("click", ()=>{ const rec = all.find(s=>s.id===b.dataset.edit); if(rec) openForm(rec); });
  });
}

CD.on("shipments", refresh);
CD.on("cargo", renderCargo);
CD.on("tab", t=>{ if(t==="flights"){ refresh(); renderCargo(); } });
CD.on("ready", ()=>{ shell(); refresh(); renderCargo(); });
})();
</script>

<script>
/* =====================================================================
   ACCOUNTING & ANALYSIS TAB
   ===================================================================== */
(function(){
"use strict";
const CD = window.CD, Charts = window.CDCharts;
const root = document.getElementById("view-accounting");
let built = false;
let gran = "month";     // day | week | month | year
let countryFilter = "ALL";
let dispCurrency = "KRW"; // USD | KRW | JPY — currency all costs are DISPLAYED in (converted live)
try{ dispCurrency = localStorage.getItem("cargodesk_dispCurrency") || "KRW"; }catch(e){}
/* 집계 대상 기간 — 카드·차트·표가 모두 이 기간만 본다 */
const aRange = { start: CD.addDays(CD.todayISO(), -89), end: CD.todayISO() };
try{
  const saved = JSON.parse(localStorage.getItem("cargodesk_acctRange") || "null");
  if(saved && saved.start && saved.end){ aRange.start = saved.start; aRange.end = saved.end; }
}catch(e){}
function saveRange(){ try{ localStorage.setItem("cargodesk_acctRange", JSON.stringify(aRange)); }catch(e){} }
function inRange(iso){ return !!iso && iso >= aRange.start && iso <= aRange.end; }
function rangeText(){ return `${aRange.start} ~ ${aRange.end}`; }
/** 데이터가 존재하는 가장 이른 날짜 (전체 기간 프리셋용) */
function earliestDate(){
  let min = null;
  CD.Cache.daily.forEach(r=>{ if(r.date && (!min || r.date < min)) min = r.date; });
  CD.Cache.shipments.forEach(s=>{ if(s.cutoffDate && (!min || s.cutoffDate < min)) min = s.cutoffDate; });
  return min || CD.addDays(CD.todayISO(), -89);
}

function keyFn(){ return gran==="day"?(d=>d) : gran==="week"?CD.isoWeekKey : gran==="month"?CD.monthKey : CD.yearKey; }
function keyLabel(k){
  if(gran==="day") return CD.fmtShort(k);
  if(gran==="week") return k.replace(/^\d{4}-/,"");
  if(gran==="month") return CD.monthLabel(k);
  return k;
}
function rateFor(country){ return (CD.Cache.settings[country]) || {lastMile:0, currency: CD.CURRENCY[country]}; }
/** 항공비 청구 중량 — 부피무게(Volume Weight) 기준. 비어 있으면 실중량 → 컷오프 중량 순으로 대체한다. */
function billableWeight(s){ return (s.volumeWeight||0) || (s.actualWeight||0) || (s.cutoffWeight||0); }
function fxRate(country){ const f = CD.Cache.settings.fx || {}; return country==="KR" ? (f.usdKrw||1300) : (f.usdJpy||150); }
/** 1 unit of USD in the given display currency, from the live fx settings. */
function fxOf(cur){
  const f = CD.Cache.settings.fx || {};
  if(cur==="USD") return 1;
  if(cur==="KRW") return f.usdKrw || 1300;
  if(cur==="JPY") return f.usdJpy || 150;
  return 1;
}
function dispSym(){ return dispCurrency==="USD" ? "$" : dispCurrency==="KRW" ? "₩" : "¥"; }
/** Convert an amount denominated in `country`'s own local currency into the selected display currency (dispCurrency), using the live fx rate. */
function toDisp(amountLocal, country){
  const usd = (amountLocal||0) / fxRate(country);
  return usd * fxOf(dispCurrency);
}
/** Format an already-converted display-currency amount with the right symbol + precision (USD keeps cents, KRW/JPY are whole numbers). */
function fmtDisp(v){
  if(dispCurrency==="USD") return "$" + (v||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
  return dispSym() + CD.fmtNum(v||0);
}
/** 합계처럼 큰 금액은 센트까지 보면 자릿수만 길어진다. 정수로 끊어 읽기 쉽게. */
function fmtDisp0(v){ return dispSym() + Math.round(v||0).toLocaleString("en-US"); }
function packingRates(){ return CD.Cache.settings.packing || {baseUsd:1.29, stepUsd:0.6}; }
function tierUsd(k){ const p = packingRates(); return p.baseUsd + p.stepUsd*(k-1); }
function airTiers(){ return CD.Cache.settings.air || {thresholdKg:700, lowRateUsd:1.30, highRateUsd:1.15}; }
/** Air freight rate in USD/kg for one shipment, tiered by its ACTUAL weight. */
/**
 * 단가 구간은 부피무게로 가른다: 700kg 이상 $1.15/kg, 미만 $1.30/kg.
 * 단, 구간 요율 시행일(tierFromDate) 이전 건은 구간 없이 $1.30 단일 적용이었다.
 */
function airRateUsdFor(volumeWeightKg, dateISO){
  const t = airTiers();
  if(t.tierFromDate && dateISO && dateISO < t.tierFromDate) return t.lowRateUsd;
  return (volumeWeightKg||0) >= t.thresholdKg ? t.highRateUsd : t.lowRateUsd;
}
/** 한 항공건의 항공비 (USD) = 부피무게 × 부피무게 구간 단가 */
function airCostUsd(s){ const w = billableWeight(s); return w * airRateUsdFor(w, s.cutoffDate); }
/** 취급주의 출고비 — 지정 SKU 1 EA당 정액 */
function handlingRate(){ const h = CD.Cache.settings.handling || {}; return h.perEaUsd == null ? 0.39 : Number(h.perEaUsd)||0; }
/**
 * 취급주의 EA는 월(YYYY-MM) 또는 일(YYYY-MM-DD) 단위로 등록된다.
 * 월로 등록된 건은 그 달 해당 국가의 일별 출고 수량 비율로 날짜에 쪼개서,
 * 일별·주별 집계에서도 제자리를 찾아가게 한다. 총액은 그대로 보존된다.
 * @returns {Object} date -> { country: ea }
 */
function handlingEaByDate(){
  const out = {};
  (CD.Cache.handling||[]).forEach(h=>{
    const ea = Number(h.ea)||0;
    if(!ea || !h.period || !h.country) return;
    const isDay = h.period.length === 10;
    const days = CD.Cache.daily.filter(d=> d.country===h.country && d.date &&
      (isDay ? d.date===h.period : d.date.slice(0,7)===h.period));
    const tot = days.reduce((x,d)=> x + (d.shipped||0), 0);
    if(days.length && tot > 0){
      days.forEach(d=>{
        out[d.date] = out[d.date] || {};
        out[d.date][h.country] = (out[d.date][h.country]||0) + ea * ((d.shipped||0)/tot);
      });
    }else{
      // 그 기간에 출고 기록이 없으면 기간 마지막 날에 통째로 단다
      const date = isDay ? h.period
        : h.period + "-" + CD.pad2(CD.daysInMonth(Number(h.period.slice(0,4)), Number(h.period.slice(5,7))-1));
      out[date] = out[date] || {};
      out[date][h.country] = (out[date][h.country]||0) + ea;
    }
  });
  return out;
}
/** 트럭킹 — 컷오프가 있는 날 하루당 정액 (건수와 무관) */
function truckingRate(){ const t = CD.Cache.settings.trucking || {}; return t.perDayUsd == null ? 100 : Number(t.perDayUsd)||0; }
/**
 * 컷오프 날짜별 트럭킹비를 국가에 안분한다.
 * 창고→공항 트럭은 하루 한 번이라 같은 날 컷오프가 몇 건이든, 국가가 몇 개든 하루 정액이다.
 * 국가별 표에 나눠 싣기 위해 그날 부피중량 비율로 쪼갠다 (국가 필터와 무관하게 전체 기준으로 쪼갠 뒤 필요한 몫만 쓴다).
 */
function truckingByDate(start, end){
  const perDay = truckingRate();
  const wByDate = {};
  CD.Cache.shipments.forEach(s=>{
    if(!s.cutoffDate || s.cutoffDate < start || s.cutoffDate > end) return;
    const d = wByDate[s.cutoffDate] = wByDate[s.cutoffDate] || {};
    d[s.country] = (d[s.country]||0) + billableWeight(s);
  });
  const out = {};
  Object.keys(wByDate).forEach(date=>{
    const w = wByDate[date];
    const cs = Object.keys(w);
    const tot = cs.reduce((a,c)=> a + w[c], 0);
    out[date] = {};
    cs.forEach(c=>{ out[date][c] = tot > 0 ? perDay * (w[c]/tot) : perDay / cs.length; });
  });
  return out;
}
/** 합포장(consolidated packing) cost in USD for one daily record, from its box-count fields. */
function packingCostUsd(rec){
  let total = 0;
  for(let k=1; k<=CD.PACK_MAX; k++){ total += (rec["pack"+k]||0) * tierUsd(k); }
  return total;
}

            <div class="field"><label>기준 이상 단가 ($/kg)</label><input type="number" min="0" step="0.01" class="num-input" id="rAirHigh"></div>
            <div class="field full"><label>구간 요율 시행일 (이전 건은 기준 미만 단가 단일 적용)</label><input type="date" class="mono" id="rAirTierFrom"></div>
          </div>
          <div class="help" style="margin-top:6px;">항공비는 <b>부피무게 × 부피무게 구간 단가</b>. 트럭킹은 컷오프가 있는 <b>날짜 1일당 정액</b>으로, 같은 날 몇 건이든 한 번만 붙습니다.</div>
        </div>
        <div class="card tight">
          <div class="row" style="margin-bottom:10px;"><b style="font-size:12.5px;">환율 (USD 기준)</b></div>
          <div class="grid" style="grid-template-columns:1fr 1fr; gap:10px;">
            <div class="field"><label>1 USD = ? KRW</label><input type="number" min="0" step="0.01" class="num-input" id="rFxKrw"></div>
            <div class="field"><label>1 USD = ? JPY</label><input type="number" min="0" step="0.01" class="num-input" id="rFxJpy"></div>
          </div>
          <div class="help" id="rFxUpdated" style="margin-top:6px;"></div>
          <button type="button" class="btn ghost small" id="rFxAutoBtn" style="margin-top:8px; display:none;">실시간 갱신 켜기</button>
        </div>
      </div>
      <div class="grid two" id="rateForms"></div>
      </div>
    </div>


    <div class="section row between">
      <div class="row">
        <div class="seg" id="aGranSeg">

/* =====================================================================
   출고 데이터 업로드 → 취급주의 EA 자동 집계
   파일 규격: 마켓 | 주문번호 | market_order_number | master SKU | 출고개수 | 출고날짜
   SKU가 취급주의 마스터에 있으면 그 행의 출고개수를 국가·월별로 더한다.
   ===================================================================== */
const XLSX_CDN = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
let xlsxLoading = null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise((res, rej)=>{
    const sc = document.createElement("script");
    sc.src = XLSX_CDN;
    sc.onload = ()=> res(window.XLSX);
    sc.onerror = ()=> rej(new Error("엑셀 라이브러리를 불러오지 못했습니다. 네트워크를 확인해주세요."));
    document.head.appendChild(sc);
  });
  return xlsxLoading;
}
function channelMap(){ return CD.Cache.settings.channels || {}; }
/** 헤더 이름이 조금씩 달라도 찾아내도록 느슨하게 맞춘다 */
function findCol(headers, cands){
  const norm = x => String(x==null?"":x).toLowerCase().replace(/[\s_\-·.]/g,"");
  const hs = headers.map(norm);
  for(const cand of cands){
    const c = norm(cand);
    const i = hs.findIndex(h=> h===c);
    if(i >= 0) return i;
  }
  for(const cand of cands){
    const c = norm(cand);
    const i = hs.findIndex(h=> h.includes(c));
    if(i >= 0) return i;
  }
  return -1;
}
/** 엑셀 날짜(숫자 serial / Date / 문자열) → "YYYY-MM" */
function toMonth(v){
  if(v == null || v === "") return null;
  if(v instanceof Date && !isNaN(v)) return v.getFullYear() + "-" + CD.pad2(v.getMonth()+1);
  if(typeof v === "number"){                       // 엑셀 serial (1900 기준)
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d) ? null : d.getUTCFullYear() + "-" + CD.pad2(d.getUTCMonth()+1);
  }
  const t = String(v).trim();
  let m = t.match(/^(\d{4})[-/.](\d{1,2})/);
  if(m) return m[1] + "-" + CD.pad2(Number(m[2]));
  const d = new Date(t);
  return isNaN(d) ? null : d.getFullYear() + "-" + CD.pad2(d.getMonth()+1);
}

function parseOrderRows(rows){
  const headers = rows[0] || [];
  const iMk  = findCol(headers, ["마켓","채널","market","몰"]);
  const iSku = findCol(headers, ["master SKU","masterSKU","마스터SKU","SKU"]);
  const iQty = findCol(headers, ["출고개수","출고수량","수량","qty","quantity"]);
  const iDt  = findCol(headers, ["출고날짜","출고일","출고일자","date"]);
  const missing = [];
  if(iMk < 0)  missing.push("마켓");
  if(iSku < 0) missing.push("master SKU");
  if(iQty < 0) missing.push("출고개수");
  if(iDt < 0)  missing.push("출고날짜");
  if(missing.length) throw new Error(`필수 열을 찾지 못했습니다: ${missing.join(", ")}\n첫 줄이 헤더인지 확인해주세요.`);

  const master = new Set((CD.Cache.handlingSkus||[]).map(x=>x.sku));
  const cmap = channelMap();
  const agg = {};                 // "KR_2026-09" -> ea
  const unknownCh = {};           // 국가 미지정 채널 -> 취급주의 EA
  const months = new Set();
  let totalRows = 0, totalEa = 0, matchedRows = 0, matchedEa = 0, badDate = 0, noSku = 0;
  const hitSkus = new Set();

  for(let r = 1; r < rows.length; r++){
    const row = rows[r];
    if(!row || row.length === 0) continue;
    const sku = String(row[iSku]==null ? "" : row[iSku]).trim();
    if(!sku){ noSku++; continue; }
    const qty = Number(row[iQty]) || 0;
    totalRows++; totalEa += qty;
    if(!master.has(sku)) continue;               // 취급주의 대상 아님
    matchedRows++; matchedEa += qty; hitSkus.add(sku);
    const month = toMonth(row[iDt]);
    if(!month){ badDate += qty; continue; }
    months.add(month);
    const ch = String(row[iMk]==null ? "" : row[iMk]).trim();
    const country = cmap[ch];
    if(country !== "KR" && country !== "JP"){ unknownCh[ch] = (unknownCh[ch]||0) + qty; continue; }
    const key = `${country}_${month}`;
    agg[key] = (agg[key]||0) + qty;
  }
  return { agg, unknownCh, months:[...months].sort(), totalRows, totalEa, matchedRows, matchedEa,
           badDate, noSku, skuCount: hitSkus.size, masterCount: master.size };
}

async function onUpFile(e){

  prev.innerHTML = "";
  try{
    const XLSX = await loadXlsx();
    const buf = await file.arrayBuffer();
    st.textContent = "파일 분석 중…";
    await new Promise(r=> setTimeout(r, 20));           // 상태 문구가 그려질 틈을 준다

    st.innerHTML = `<span style="color:var(--critical-ink)">${String(err.message||err).replace(/\n/g,"<br>")}</span>`;

/**
 * 미지정 채널의 국가를 정하면 그 채널 EA를 합계에 넣는다.
 * 채널별 월 분포까지 다시 읽지 않고, 그 채널 전체 EA를 이미 잡힌 월 비율로 나눈다
 * (월이 하나면 정확히 그 달로 들어간다).
 */
function recomputeChannel(ch, country, ea){
  const r = upResult;
  if(r.chAssigned && r.chAssigned[ch]){                       // 직전 배정을 되돌린다
    const prev = r.chAssigned[ch];
    Object.keys(prev.added).forEach(k=>{
      r.agg[k] -= prev.added[k];
      if(r.agg[k] <= 0.0001) delete r.agg[k];
    });
  }
  r.chAssigned = r.chAssigned || {};
  delete r.chAssigned[ch];
  if(country !== "KR" && country !== "JP") return;
  const months = r.months.length ? r.months : [CD.todayISO().slice(0,7)];
  const weights = months.map(m=>{
    const a = r.agg[`KR_${m}`]||0, b = r.agg[`JP_${m}`]||0;
    return a + b;
  });
  const wTot = weights.reduce((x,y)=>x+y, 0);
  const added = {};
  months.forEach((m,i)=>{
    const share = wTot > 0 ? weights[i]/wTot : 1/months.length;
    const v = ea*share;
    if(v <= 0) return;
    const key = `${country}_${m}`;
    r.agg[key] = (r.agg[key]||0) + v;
    added[key] = v;
  });
  r.chAssigned[ch] = { country, added };
}

async function applyUpload(){
  const r = upResult;
  if(!r) return;
  const keys = Object.keys(r.agg).sort();
  if(!keys.length) return;
  const btn = document.getElementById("upApply");
  btn.disabled = true; btn.textContent = "반영 중…";
  // 새로 국가를 지정한 채널은 다음 업로드에도 쓰이도록 채널 맵에 저장한다
  if(r.chAssigned && Object.keys(r.chAssigned).length){
    const patch = { ...channelMap() };
    Object.keys(r.chAssigned).forEach(ch=>{ patch[ch] = r.chAssigned[ch].country; });
    await CD.Store.saveSettings({ channels: patch });
  }
  const stamp = CD.todayISO();
  for(const k of keys){
    const country = k.slice(0,2), period = k.slice(3);
    await CD.Store.upsertHandling({
      id:k, country, period,
      ea: Math.round(r.agg[k]),
      memo: `출고 데이터 업로드 (${stamp})`
    });
  }
  closeAcctModal();
  flashHd(`${keys.length}개 구간이 반영되었습니다.`);
}

/** 기간별 상세 내역을 화면과 같은 값으로 엑셀로 내려받는다 (숫자는 서식 없는 raw 값) */
async function exportDetail(){
  if(!lastRows.length){ alert("내보낼 데이터가 없습니다."); return; }
  try{
    const XLSX = await loadXlsx();
    const wb = XLSX.utils.book_new();
    const cur = dispCurrency;
    const head = ["기간","국가","픽킹","팩킹","출고","항공부킹(건)","팔레트(PLT)","부피중량(kg)",
                  `출고비(${cur})`,`통관·택배비(${cur})`,`항공비(${cur})`,`트럭킹비(${cur})`,
                  `취급주의 출고비(${cur})`,`총비용(${cur})`,`건당비용(${cur})`,"취급주의(EA)"];
    const round2 = v => Math.round((v||0)*100)/100;
    const allRows = [];
    lastCountries.forEach(c=>{
      const aoa = [head];
      for(let i = lastRows.length-1; i >= 0; i--){          // 최신 → 오래된, 화면과 같은 순서
        const b = lastRows[i].byCountry[c]; if(!b) continue;
        const total = bucketCost(b);
        const po = b.shipped>0 ? total/b.shipped : 0;
        const line = [
          keyLabel(lastRows[i].key), CD.COUNTRY_LABEL[c],
          b.picked, b.packed, b.shipped, b.bookings, b.pallet, round2(b.weight),
          round2(toDisp(b.packingCost, c)), round2(toDisp(b.lastMileCost, c)),
          round2(toDisp(b.airCost, c)), round2(toDisp(b.truckingCost||0, c)),
          round2(toDisp(b.handlingCost||0, c)), round2(toDisp(total, c)), round2(toDisp(po, c)),
          Math.round(b.handlingEa||0)
        ];
        aoa.push(line);
        allRows.push(line);
      }
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = head.map((h,i)=> ({ wch: i<2 ? 12 : Math.max(11, h.length+2) }));
      ws["!freeze"] = { xSplit:0, ySplit:1 };
      XLSX.utils.book_append_sheet(wb, ws, CD.COUNTRY_LABEL[c]);
    });
    if(lastCountries.length > 1){                            // 두 나라를 한 장에서 보고 싶을 때
      const ws = XLSX.utils.aoa_to_sheet([head].concat(allRows));
      ws["!cols"] = head.map((h,i)=> ({ wch: i<2 ? 12 : Math.max(11, h.length+2) }));
      XLSX.utils.book_append_sheet(wb, ws, "전체");
    }
    const granTxt = gran==='day'?'일별':gran==='week'?'주별':gran==='month'?'월별':'연도별';
    XLSX.writeFile(wb, `기간별상세내역_${aRange.start}_${aRange.end}_${granTxt}_${cur}.xlsx`);
  }catch(err){
    alert(String(err.message||err));
  }
}

function aggregate(countries){
  const kf = keyFn();
  const buckets = {};
  function cell(k,c){
    buckets[k] = buckets[k] || {};
    buckets[k][c] = buckets[k][c] || {shipped:0,packed:0,picked:0,pallet:0,pkg:0,weight:0,bookings:0,cutoffDays:0,handlingEa:0,packingCost:0,lastMileCost:0,airCost:0,truckingCost:0,handlingCost:0};
    return buckets[k][c];
  }
  CD.Cache.daily.forEach(r=>{
    if(!countries.includes(r.country) || !inRange(r.date)) return;
    const k = kf(r.date); const b = cell(k, r.country);
    b.shipped += r.shipped||0; b.packed += r.packed||0; b.picked += r.picked||0;
    b.packingCost += packingCostUsd(r) * fxRate(r.country);
    b.lastMileCost += (r.shipped||0) * (rateFor(r.country).lastMile||0);
  });
  CD.Cache.shipments.forEach(s=>{
    if(!countries.includes(s.country) || !inRange(s.cutoffDate)) return;
    const k = kf(s.cutoffDate); const b = cell(k, s.country);
    b.weight += billableWeight(s);
    b.pallet += s.palletCount||0; b.pkg += s.packageCount||0; b.bookings += 1;
    b.airCost += airCostUsd(s) * fxRate(s.country);
  });
  // 트럭킹 — 컷오프 날짜 단위 정액을 국가별로 안분해 넣는다
  const truck = truckingByDate(aRange.start, aRange.end);
  Object.keys(truck).forEach(date=>{
    const k = kf(date);
    Object.keys(truck[date]).forEach(c=>{
      if(!countries.includes(c)) return;
      const b = cell(k, c);
      b.truckingCost += truck[date][c] * fxRate(c);
      b.cutoffDays += 1;
    });
  });
  // 취급주의 출고비 — 날짜로 쪼갠 EA를 구간에 싣는다
  const hea = handlingEaByDate();
  const hRate = handlingRate();
  Object.keys(hea).forEach(date=>{
    if(!inRange(date)) return;
    const k = kf(date);
    Object.keys(hea[date]).forEach(c=>{
      if(!countries.includes(c)) return;
      const b = cell(k, c);
      b.handlingEa += hea[date][c];
      b.handlingCost += hea[date][c] * hRate * fxRate(c);
    });
  });
  const keys = Object.keys(buckets).sort();
  return keys.map(k=>({key:k, byCountry:buckets[k]}));
}

function bucketTotal(row){
  const countries = Object.keys(row.byCountry);
  return countries.reduce((acc,c)=>{
    const b = row.byCountry[c];
    acc.shipped+=b.shipped; acc.packingCost+=b.packingCost; acc.lastMileCost+=b.lastMileCost;
    acc.airCost+=b.airCost; acc.truckingCost+=b.truckingCost||0; acc.handlingCost+=b.handlingCost||0;
    return acc;
  }, {shipped:0, packingCost:0, lastMileCost:0, airCost:0, truckingCost:0, handlingCost:0});
}
function bucketCost(b){ return b.packingCost + b.lastMileCost + b.airCost + (b.truckingCost||0) + (b.handlingCost||0); }

/* ---------------------------------------------------------------------
   증감 비교는 화면의 집계 단위(일/주/월/연)와 상관없이 항상 "최근 30일 vs
   직전 30일"로 본다. 월 단위로 비교하면 진행 중인 달이 항상 손해로 보인다.
   --------------------------------------------------------------------- */
const overlay = document.getElementById("modalOverlay");
const modalBody = document.getElementById("modalBody");
function closeAcctModal(){ overlay.hidden = true; modalBody.className = "modal"; modalBody.innerHTML = ""; }
// 바깥을 눌러 닫을 때도 wide 변형이 남지 않게 되돌린다 (닫기 자체는 다른 모듈이 처리)
overlay.addEventListener("click", e=>{ if(e.target===overlay) modalBody.className = "modal"; });
let hdQ = "", hdPage = 0, hdCountry = "ALL", hdEditing = null;
const HD_PER = 12;
let skuQ = "", skuPage = 0;
const SKU_PER = 15;
let lastRows = [], lastCountries = [];      // 엑셀 내보내기가 화면과 같은 값을 쓰도록 보관

const DELTA_DAYS = 30;
function deltaWindows(){
  const end = CD.todayISO();
  const start = CD.addDays(end, -(DELTA_DAYS-1));
  const pEnd = CD.addDays(start, -1);
  const pStart = CD.addDays(pEnd, -(DELTA_DAYS-1));
  return { start, end, pStart, pEnd };
}
/** 한 구간(시작~종료, 양 끝 포함)의 국가별 수량·비용 합계 (각 국가 현지통화 기준) */
function rangeAgg(start, end, countries){
  const by = {};
  countries.forEach(c=> by[c] = {shipped:0, packingCost:0, lastMileCost:0, airCost:0, truckingCost:0, handlingCost:0});
  CD.Cache.daily.forEach(r=>{
    if(!by[r.country] || !r.date || r.date < start || r.date > end) return;
    const b = by[r.country];
    b.shipped += r.shipped||0;
    b.packingCost += packingCostUsd(r) * fxRate(r.country);
    b.lastMileCost += (r.shipped||0) * (rateFor(r.country).lastMile||0);
  });
  CD.Cache.shipments.forEach(sh=>{
    if(!by[sh.country] || !sh.cutoffDate || sh.cutoffDate < start || sh.cutoffDate > end) return;
    by[sh.country].airCost += airCostUsd(sh) * fxRate(sh.country);
  });
  const truck = truckingByDate(start, end);
  Object.keys(truck).forEach(date=>{
    Object.keys(truck[date]).forEach(c=>{
      if(by[c]) by[c].truckingCost += truck[date][c] * fxRate(c);
    });
  });
  const hea = handlingEaByDate(), hRate = handlingRate();
  Object.keys(hea).forEach(date=>{
    if(date < start || date > end) return;
    Object.keys(hea[date]).forEach(c=>{
      if(by[c]) by[c].handlingCost += hea[date][c] * hRate * fxRate(c);
    });
  });
  return by;
}

function refresh(){
  if(!built) return;
  renderRateForms();
  renderHandling();
  const countries = countryFilter==="ALL" ? CD.COUNTRIES : [countryFilter];
  const rows = aggregate(countries);
  const dw = deltaWindows();

  // KPIs — money totals are kept per-country (KRW and JPY are not summed together)
  let sumShipped=0;
  rows.forEach(r=>{ const t = bucketTotal(r); sumShipped+=t.shipped; });

  if(!rows.length){
    const aK0 = document.getElementById("aKpis");
    aK0.className = "section";
    aK0.innerHTML = `<div class="card"><div class="empty-note">${rangeText()} 구간에 데이터가 없습니다. 기간을 넓혀보세요.</div></div>`;
    document.getElementById("aCostKpis").innerHTML = "";
    document.getElementById("aCostHint").textContent = rangeText();
    document.getElementById("aTrendChart").innerHTML = "";
    document.getElementById("aTrendLegend").innerHTML = "";
    document.getElementById("aCompWrap").innerHTML = "";
    document.getElementById("aCompLegend").innerHTML = "";
    document.getElementById("aPerOrderKpis").innerHTML = "";
    document.getElementById("aPerOrderHint").textContent = rangeText();
    document.getElementById("aTables").innerHTML = "";
    document.getElementById("aTableHint").textContent = rangeText();
    return;
  }
  const cur30 = rangeAgg(dw.start, dw.end, countries);
  const prev30 = rangeAgg(dw.pStart, dw.pEnd, countries);
  function countryStats(c){
    let shipped=0, cost=0;
    rows.forEach(r=>{ const b=r.byCountry[c]; if(b){ shipped+=b.shipped; cost+=bucketCost(b); } });
    const perOrder = shipped>0 ? cost/shipped : 0;
    // 증감은 최근 30일 건당비용 vs 직전 30일 건당비용
    let deltaPct = null;
    const nb = cur30[c], pb = prev30[c];
    const nowPO  = nb && nb.shipped>0 ? bucketCost(nb)/nb.shipped : null;
    const prevPO = pb && pb.shipped>0 ? bucketCost(pb)/pb.shipped : null;
    if(nowPO!=null && prevPO) deltaPct = ((nowPO-prevPO)/prevPO)*100;
    return {shipped, cost, perOrder, deltaPct};
  }

  const kpiCountries = countryFilter==="ALL" ? CD.COUNTRIES : [countryFilter];
  const totalCostDisp = kpiCountries.reduce((s,c)=> s + toDisp(countryStats(c).cost, c), 0);
  const label = kpiCountries.map(c=>CD.COUNTRY_LABEL[c]).join('+');
  // 윗줄: 총 출고 수량 · 총 물류비 (각 2칸)  /  아랫줄: 국가별 물류비 · 건당 평균비용 (각 1칸)
  const oneCountry = kpiCountries.length === 1;
  const rangeSub = rangeText();
  const cards = [
    `<div class="kpi wide"><div class="label">총 출고 수량</div><div class="value">${CD.fmtNum(sumShipped)}</div><div class="sub">${label} 합계 · ${rangeSub}</div></div>`,
    `<div class="kpi wide"><div class="label">총 물류비</div><div class="value">${fmtDisp0(totalCostDisp)}</div><div class="sub">출고비+통관·택배+항공+트럭킹+취급주의 · ${rangeSub}</div></div>`
  ];
  kpiCountries.forEach(c=>{
    const st = countryStats(c);
    const costDisp = toDisp(st.cost, c), perOrderDisp = toDisp(st.perOrder, c);
    const flat = st.deltaPct!=null && Math.abs(st.deltaPct) < 0.05;
    const dCls = (st.deltaPct==null || flat) ? "" : (st.deltaPct<0 ? " good" : " bad");
    const dot = `<span class="dot" style="background:var(--${c.toLowerCase()})"></span>`;
    const wide = oneCountry ? " wide" : "";     // 국가 하나면 아랫줄도 2칸씩 채운다
    cards.push(`<div class="kpi${wide}"><div class="label">${dot}${CD.COUNTRY_LABEL[c]} 물류비용</div><div class="value">${fmtDisp0(costDisp)}</div><div class="sub" title="출고비+통관·택배+항공+트럭킹+취급주의">${CD.fmtShort(aRange.start)}~${CD.fmtShort(aRange.end)} 합계</div></div>`);
    cards.push(`<div class="kpi${wide}"><div class="label">${dot}${CD.COUNTRY_LABEL[c]} 건당 평균비용</div><div class="value">${fmtDisp(perOrderDisp)}</div><div class="sub">${st.deltaPct==null?'<span class="delta">최근 30일 비교 불가</span>':`<span class="delta${dCls}">${flat?"":(st.deltaPct>0?"▲":"▼")}${Math.abs(st.deltaPct).toFixed(1)}%</span><span style="color:var(--muted)">직전 30일 대비</span>`}</div></div>`);
  });
  const aK = document.getElementById("aKpis");
  aK.className = "section grid kpis24";
  aK.innerHTML = cards.join("");
  CD.fitKpi(document.getElementById("aKpis"));

  /* ---- 비용 항목별 (출고비 / 통관·택배비 / 항공비) ---- */
  const COST_KEYS = [
    {key:"packingCost",  label:"출고비",      color:"--cost-pack"},
    {key:"lastMileCost", label:"통관·택배비",  color:"--cost-lastmile"},
    {key:"airCost",      label:"항공비",      color:"--cost-air"},
    {key:"truckingCost", label:"트럭킹비",     color:"--cost-truck"},
    {key:"handlingCost", label:"취급주의 출고비", color:"--cost-handling"},
  ];
  /** 한 구간(row)의 특정 비용 항목을 표시 통화로 합산 */
  function bucketTypeSum(row, key){
    return kpiCountries.reduce((sum,c)=>{
      const b = row.byCountry[c];
      return b ? sum + toDisp(b[key]||0, c) : sum;
    }, 0);
  }
  const typeTotals = {};
  COST_KEYS.forEach(t=>{ typeTotals[t.key] = rows.reduce((sum,r)=> sum + bucketTypeSum(r, t.key), 0); });
  const grandTotal = COST_KEYS.reduce((sum,t)=> sum + typeTotals[t.key], 0);

  /** 30일 창 하나의 특정 비용 항목을 표시 통화로 합산 */
  function winTypeSum(win, key){
    return kpiCountries.reduce((sum,c)=>{
      const b = win[c];
      return b ? sum + toDisp(b[key]||0, c) : sum;
    }, 0);
  }
  document.getElementById("aCostHint").textContent =
    `${label} · ${rangeText()} 합계 · ${dispSym()} 기준 · 증감은 최근 30일(${CD.fmtShort(dw.start)}~${CD.fmtShort(dw.end)}) vs 직전 30일`;
  document.getElementById("aCostKpis").innerHTML = COST_KEYS.map(t=>{
    const total = typeTotals[t.key];
    const share = grandTotal>0 ? total/grandTotal*100 : 0;
    let d = null;                                   // 최근 30일 vs 직전 30일
    const now = winTypeSum(cur30, t.key);
    const before = winTypeSum(prev30, t.key);
    if(before>0) d = (now-before)/before*100;
    const dFlat = d!=null && Math.abs(d) < 0.05;
    const dCls = (d==null || dFlat) ? "" : (d<0 ? " good" : " bad");
    const dTxt = d==null ? `<span class="delta">비교 불가</span>`
                         : `<span class="delta${dCls}">${dFlat?"":(d>0?"▲":"▼")}${Math.abs(d).toFixed(1)}%</span>`;
    return `<div class="kpi">
      <div class="label"><span class="dot" style="background:var(${t.color})"></span>${t.label}</div>
      <div class="value">${fmtDisp0(total)}</div>
      <div class="sub">${dTxt}<span style="color:var(--muted)">전체의 ${share.toFixed(1)}%</span></div>
      <div style="height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;">
        <div style="height:100%; width:${share}%; background:var(${t.color}); border-radius:3px;"></div>
      </div>
    </div>`;
  }).join("");
  CD.fitKpi(document.getElementById("aCostKpis"));

  /* ---- 주문 건당 평균 비용 (트럭킹은 항공비에 합산) ---- */
  const PER_ORDER = [
    {label:"건당 출고비",        keys:["packingCost"],               color:"--cost-pack"},
    {label:"건당 통관·택배비",    keys:["lastMileCost"],              color:"--cost-lastmile"},
    {label:"건당 항공비",        keys:["airCost","truckingCost"],    color:"--cost-air", note:"트럭킹 포함"},
    {label:"건당 취급주의 출고비", keys:["handlingCost"],              color:"--cost-handling"},
  ];
  /** 한 국가의 특정 비용 항목 합계 (표시 통화) */
  function typeSumFor(c, keys){
    return rows.reduce((sum,r)=>{
      const b = r.byCountry[c];
      return b ? sum + keys.reduce((x,k)=> x + toDisp(b[k]||0, c), 0) : sum;
    }, 0);
  }
  function shippedFor(c){
    return rows.reduce((sum,r)=>{ const b = r.byCountry[c]; return b ? sum + b.shipped : sum; }, 0);
  }
  const perOrderTotal = PER_ORDER.reduce((sum,t)=>{
    const cost = kpiCountries.reduce((x,c)=> x + typeSumFor(c, t.keys), 0);
    return sum + (sumShipped>0 ? cost/sumShipped : 0);
  }, 0);
  document.getElementById("aPerOrderHint").textContent =
    `${label} · ${rangeText()} · 출고 ${CD.fmtNum(sumShipped)}건 기준 · 합계 ${fmtDisp(perOrderTotal)}`;
  document.getElementById("aPerOrderKpis").innerHTML = PER_ORDER.map(t=>{
    const cost = kpiCountries.reduce((x,c)=> x + typeSumFor(c, t.keys), 0);
    const per = sumShipped>0 ? cost/sumShipped : 0;
    // 국가가 둘 이상이면 통합 평균만으로는 어느 쪽이 비싼지 안 보인다
    const byC = kpiCountries.length>1 ? kpiCountries.map(c=>{
      const sh = shippedFor(c);
      const v = sh>0 ? typeSumFor(c, t.keys)/sh : 0;
      return `<span class="dot" style="background:var(--${c.toLowerCase()})"></span>${CD.COUNTRY_LABEL[c]} ${fmtDisp(v)}`;
    }).join(" · ") : `총 ${fmtDisp0(cost)}`;
    return `<div class="kpi">
      <div class="label"><span class="dot" style="background:var(${t.color})"></span>${t.label}${t.note?` <span style="color:var(--muted)">(${t.note})</span>`:""}</div>
      <div class="value">${fmtDisp(per)}</div>
      <div class="sub">${byC}</div>
    </div>`;
  }).join("");
  CD.fitKpi(document.getElementById("aPerOrderKpis"));

  // trend chart: one line per country (cost per order), all converted to the selected display currency
  const labels = rows.map(r=>keyLabel(r.key));
  const series = countries.map(c=>({
    key:c, label: CD.COUNTRY_LABEL[c], color: CD.cssVar("--"+c.toLowerCase()),
    fmt: v=> fmtDisp(v),
    values: rows.map(r=>{
      const b = r.byCountry[c];
      if(!b || b.shipped<=0) return NaN;
      return toDisp(bucketCost(b)/b.shipped, c);
    })
  }));
  Charts.lineChart(document.getElementById("aTrendChart"), {
    series, labels, yFmt: v=> dispSym()+CD.fmtNum(v),
    legend: document.getElementById("aTrendLegend")
  });
  {
    const fx = CD.Cache.settings.fx || {};
    const fxNote = `1 USD = ₩${CD.fmtNum(fx.usdKrw||0)} · ¥${CD.fmtNum(fx.usdJpy||0)}${fx.auto?' · 실시간':''}`;
    document.getElementById("aTrendLegend").insertAdjacentHTML("beforeend", `<div class="item" style="color:var(--muted)">${fxNote}</div>`);
  }

  // composition chart: per country small multiple, stacked fulfill vs air — values converted to the selected display currency
  const compWrap = document.getElementById("aCompWrap");
  compWrap.innerHTML = "";
  compWrap.className = "grid " + (countries.length>1?"even":"");
  countries.forEach((c,i)=>{
    const box = document.createElement("div");
    box.innerHTML = `<div class="row" style="margin-bottom:6px;"><span class="badge ${c.toLowerCase()}">${CD.COUNTRY_LABEL[c]}</span></div><div class="chart-holder"></div>`;
    compWrap.appendChild(box);
    // 출고비와 취급주의 출고비는 같은 창고 작업비라 한 칸으로 쌓고, 툴팁에서 나눠 보여준다
    const data = rows.map(r=>{
      const b = r.byCountry[c] || {};
      const pack = toDisp(b.packingCost||0, c);
      const hand = toDisp(b.handlingCost||0, c);
      return {
        date: r.key,
        packingTotal: pack + hand,
        packingCost: pack,
        handlingCost: hand,
        lastMileCost: toDisp(b.lastMileCost||0, c),
        airCost: toDisp(b.airCost||0, c),
        truckingCost: toDisp(b.truckingCost||0, c)
      };
    });
    const compColor = {packingTotal:"--cost-pack", lastMileCost:"--cost-lastmile", airCost:"--cost-air", truckingCost:"--cost-truck"};
    const compLabel = {packingTotal:"출고비 (취급주의 포함)", lastMileCost:"통관 택배비용", airCost:"항공비용", truckingCost:"트럭킹비"};
    Charts.stackedBarChart(box.querySelector(".chart-holder"), {
      data, keys:["packingTotal","lastMileCost","airCost","truckingCost"],
      subKeys:{ packingTotal:[{key:"packingCost", label:"출고비"}, {key:"handlingCost", label:"취급주의 출고비"}] },
      colorFn:k=> CD.cssVar(compColor[k]),
      labelFn:k=> compLabel[k],
      xLabelFn: keyLabel, tipTitleFn: keyLabel,
      valueFmt: v=> fmtDisp(v),
      legend: i===countries.length-1 ? document.getElementById("aCompLegend") : null
    });
  });

  // 기간별 상세 — 국가별로 표를 나누고, 각 구간에 직전 구간 대비 증감을 붙인다
  const granLabel = gran==='day'?'일별':gran==='week'?'주별':gran==='month'?'월별':'연도별';
  document.getElementById("aTableHint").textContent =
    `${rangeText()} · ${granLabel} ${rows.length}개 구간 · ${dispSym()} 기준` +
    (rows.length > 60 ? " · 구간이 많습니다. 월별/연도별로 보시면 읽기 편합니다." : "");

  lastRows = rows; lastCountries = countries;   // 엑셀 내보내기가 화면과 같은 값을 쓰도록 보관

  /** 직전 구간 대비 증감 칩 (비용은 낮을수록 좋으므로 내려가면 초록) */
  function chg(now, before, goodUp){
    if(before===null || before===undefined || before===0) return `<span class="chg flat">–</span>`;
    const p = (now-before)/before*100;
    if(!isFinite(p)) return `<span class="chg flat">–</span>`;
    if(Math.abs(p) < 0.05) return `<span class="chg flat">0.0%</span>`;
    const up = p > 0;
    const cls = (goodUp ? up : !up) ? "good" : "bad";
    return `<span class="chg ${cls}">${up?"▲":"▼"}${Math.abs(p).toFixed(1)}%</span>`;
  }
  const maxTotal = Math.max(1, ...countries.flatMap(c=>
    rows.map(r=>{ const b=r.byCountry[c]; return b ? toDisp(bucketCost(b), c) : 0; })));

  document.getElementById("aTables").innerHTML = countries.map(c=>{
    const ordered = [...rows];                 // 오래된 → 최신 (증감 계산용)
    const trs = [];
    const sum = {picked:0,packed:0,shipped:0,bookings:0,pallet:0,weight:0,
                 packingCost:0,lastMileCost:0,airCost:0,truckingCost:0,handlingCost:0,total:0};
    for(let i = ordered.length-1; i >= 0; i--){    // 표시는 최신 → 오래된
      const b = ordered[i].byCountry[c]; if(!b) continue;
      const prev = i>0 ? ordered[i-1].byCountry[c] : null;
      const total = bucketCost(b);
      const po = b.shipped>0 ? total/b.shipped : 0;
      const prevPo = prev && prev.shipped>0 ? bucketCost(prev)/prev.shipped : null;
      const totalDisp = toDisp(total, c);
      const barPct = Math.max(2, Math.min(100, totalDisp/maxTotal*100));
      ["picked","packed","shipped","bookings","pallet","weight",
       "packingCost","lastMileCost","airCost","truckingCost","handlingCost"].forEach(k=> sum[k] += (b[k]||0));
      sum.total += total;
      trs.push(`<tr>
        <td class="text stick">${keyLabel(ordered[i].key)}</td>
        <td class="num dim">${CD.fmtNum(b.picked)}</td>
        <td class="num dim">${CD.fmtNum(b.packed)}</td>
        <td class="num key">${CD.fmtNum(b.shipped)}</td>
        <td class="text">${chg(b.shipped, prev?prev.shipped:null, true)}</td>
        <td class="num dim gsep">${CD.fmtNum(b.bookings)}건 · ${CD.fmtNum(b.pallet)}PLT</td>
        <td class="num dim">${CD.fmtNum(b.weight)}</td>
        <td class="num gsep">${fmtDisp0(toDisp(b.packingCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(b.lastMileCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(b.airCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(b.truckingCost||0, c))}</td>
        <td class="num" title="취급주의 ${CD.fmtNum(Math.round(b.handlingEa||0))} EA">${fmtDisp0(toDisp(b.handlingCost||0, c))}</td>
        <td class="num key">
          <div class="cost-cell"><span>${fmtDisp0(totalDisp)}</span>
            <span class="cost-bar"><i style="width:${barPct.toFixed(1)}%"></i></span></div>
        </td>
        <td class="num key gsep">${fmtDisp(toDisp(po, c))}</td>
        <td class="text">${chg(po, prevPo, false)}</td>
      </tr>`);
    }
    const sumPo = sum.shipped>0 ? sum.total/sum.shipped : 0;
    const foot = trs.length ? `<tfoot><tr>
        <td class="text stick">합계</td>
        <td class="num">${CD.fmtNum(sum.picked)}</td>
        <td class="num">${CD.fmtNum(sum.packed)}</td>
        <td class="num">${CD.fmtNum(sum.shipped)}</td>
        <td></td>
        <td class="num gsep">${CD.fmtNum(sum.bookings)}건 · ${CD.fmtNum(sum.pallet)}PLT</td>
        <td class="num">${CD.fmtNum(sum.weight)}</td>
        <td class="num gsep">${fmtDisp0(toDisp(sum.packingCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(sum.lastMileCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(sum.airCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(sum.truckingCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(sum.handlingCost, c))}</td>
        <td class="num">${fmtDisp0(toDisp(sum.total, c))}</td>
        <td class="num gsep">${fmtDisp(toDisp(sumPo, c))}</td>
        <td></td>
      </tr></tfoot>` : "";
    return `<div class="card" style="margin-bottom:14px;">
      <div class="row between" style="margin-bottom:10px;">
        <span class="badge ${c.toLowerCase()}">${CD.COUNTRY_LABEL[c]}</span>
        <span class="hint">출고 ${CD.fmtNum(sum.shipped)}건 · 물류비 ${fmtDisp0(toDisp(sum.total, c))} · 건당 ${fmtDisp(toDisp(sumPo, c))}</span>
      </div>
      <div class="table-wrap">
        <table class="detail">
          <thead>
            <tr class="grp-row">
              <th class="stick"></th>
              <th colspan="4">물동량</th>
              <th colspan="2" class="gsep">항공</th>
              <th colspan="6" class="gsep">비용 (${dispSym()})</th>
              <th colspan="2" class="gsep">건당</th>
            </tr>
            <tr class="col-row">
              <th class="stick">기간</th>
              <th class="num">픽킹</th><th class="num">팩킹</th><th class="num">출고</th><th>전 구간비</th>
              <th class="num gsep">부킹</th><th class="num" title="항공비 청구 중량 · 부피무게 기준">부피중량</th>
              <th class="num gsep">출고비</th><th class="num">통관·택배</th><th class="num">항공</th>
              <th class="num" title="컷오프가 있는 날 하루당 정액">트럭킹</th>
              <th class="num" title="취급주의 SKU 출고 EA × 단가">취급주의</th>
              <th class="num">총비용</th>
              <th class="num gsep">건당비용</th><th>전 구간비</th>
            </tr>
          </thead>
          <tbody>${trs.join("") || `<tr><td colspan="15" class="text empty-note">표시할 데이터가 없습니다.</td></tr>`}</tbody>
          ${foot}
        </table>
      </div>
    </div>`;
  }).join("");
}

CD.on("daily", refresh);
CD.on("shipments", refresh);
CD.on("settings", refresh);
CD.on("handling", refresh);
CD.on("handlingSkus", ()=>{ refresh(); renderSkuList(); });
CD.on("tab", t=>{ if(t==="accounting") refresh(); else if(t==="dashboard") renderHandling(); });
CD.on("ready", ()=>{ shell(); refresh(); });
})();

<script>
/* =====================================================================
   MONTHLY REPORT — 물류 총괄용 월간 요약.
   "이번 달이 어땠고, 전월 대비 무엇이 달라졌나"를 한 화면에서 판단할 수 있게
   물량 / 처리 단계별 전환율 / 합포장 효율 / 건당 물류비를 전월과 나란히 둔다.
   ===================================================================== */
(function(){
"use strict";
const CD = window.CD, Charts = window.CDCharts;
const root = document.getElementById("view-report");
let built = false;
/* 월 단위로 보면 이번 달이 진행 중일 때 비교가 왜곡된다. 그래서 오늘 기준 롤링 구간으로 본다. */
let days = 30;                    // 최근 N일
let countryFilter = "ALL";
let cur = "KRW";
try{ cur = localStorage.getItem("cargodesk_dispCurrency") || "KRW"; }catch(e){}

/* ---------- 비용 기준 (회계 탭과 동일한 계산식) ---------- */
function S(){ return CD.Cache.settings || {}; }
function fxRate(c){ const f=S().fx||{}; return c==="KR" ? (f.usdKrw||1300) : (f.usdJpy||150); }
function fxOf(x){ const f=S().fx||{}; return x==="USD"?1 : x==="KRW"?(f.usdKrw||1300) : (f.usdJpy||150); }
function sym(){ return cur==="USD"?"$" : cur==="KRW"?"₩" : "¥"; }
function toDisp(localAmt, c){ return ((localAmt||0)/fxRate(c))*fxOf(cur); }
function fmtMoney(v){
  if(cur==="USD") return "$"+(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return sym()+CD.fmtNum(v||0);
}
function packRates(){ return S().packing || {baseUsd:1.29, stepUsd:0.6}; }
function tierUsd(k){ const p=packRates(); return p.baseUsd + p.stepUsd*(k-1); }
function airTiers(){ return S().air || {thresholdKg:700, lowRateUsd:1.30, highRateUsd:1.15}; }
function lastMileOf(c){ return (S()[c]||{}).lastMile || 0; }
function truckPerDay(){ const t = S().trucking || {}; return t.perDayUsd == null ? 100 : Number(t.perDayUsd)||0; }
function handlingPerEa(){ const h = S().handling || {}; return h.perEaUsd == null ? 0.39 : Number(h.perEaUsd)||0; }
/** 청구 중량 = 부피무게 (없으면 실중량 → 컷오프 중량) */
function billableWeight(s){ return (s.volumeWeight||0) || (s.actualWeight||0) || (s.cutoffWeight||0); }

/* ---------- 구간 집계 (시작일~종료일, 양 끝 포함) ---------- */
function aggregate(start, end, countries){
  const a = { days:0, picked:0, packed:0, shipped:0, boxes:0, skuUnits:0,
              packCost:0, lastMileCost:0, airCost:0, truckCost:0, handlingCost:0, handlingEa:0, cutoffDays:0,
              peak:{date:null, v:0}, byCountry:{} };
  countries.forEach(c=> a.byCountry[c] = {picked:0,packed:0,shipped:0,boxes:0,skuUnits:0,cost:0,days:0});
  const dayset = new Set();
  CD.Cache.daily.forEach(r=>{
    if(!r.date || r.date < start || r.date > end || !countries.includes(r.country)) return;
    const b = a.byCountry[r.country];
    dayset.add(r.date); b.days++;
    a.picked += r.picked||0; a.packed += r.packed||0; a.shipped += r.shipped||0;
    b.picked += r.picked||0; b.packed += r.packed||0; b.shipped += r.shipped||0;
    let pkUsd = 0;
    for(let k=1;k<=CD.PACK_MAX;k++){
      const n = r["pack"+k]||0;
      if(!n) continue;
      a.boxes += n; b.boxes += n;
      a.skuUnits += n*k; b.skuUnits += n*k;
      pkUsd += n*tierUsd(k);
    }
    const pc = toDisp(pkUsd*fxRate(r.country), r.country);
    const lm = toDisp((r.shipped||0)*lastMileOf(r.country), r.country);
    a.packCost += pc; a.lastMileCost += lm;
    b.cost += pc + lm;
    if((r.shipped||0) > a.peak.v) a.peak = {date:r.date, v:r.shipped||0};
  });
  a.days = dayset.size;                       // 국가가 둘이어도 같은 날은 하루로 센다
  CD.Cache.shipments.forEach(s=>{
    if(!s.cutoffDate || s.cutoffDate < start || s.cutoffDate > end || !countries.includes(s.country)) return;
    const t = airTiers();
    const bw = billableWeight(s);                                   // 청구 중량 · 단가 구간 모두 부피무게 기준
    const tiered = !(t.tierFromDate && s.cutoffDate && s.cutoffDate < t.tierFromDate);
    const usd = bw * ((tiered && bw >= t.thresholdKg) ? t.highRateUsd : t.lowRateUsd);
    const v = toDisp(usd*fxRate(s.country), s.country);
    a.airCost += v;
    if(a.byCountry[s.country]) a.byCountry[s.country].cost += v;
  });
  // 트럭킹 — 컷오프가 있는 날 하루당 정액. 국가별로는 그날 부피중량 비율로 안분한다.
  const wByDate = {};
  CD.Cache.shipments.forEach(s=>{
    if(!s.cutoffDate || s.cutoffDate < start || s.cutoffDate > end) return;
    const d = wByDate[s.cutoffDate] = wByDate[s.cutoffDate] || {};
    d[s.country] = (d[s.country]||0) + billableWeight(s);
  });
  const perDay = truckPerDay();
  Object.keys(wByDate).forEach(date=>{
    const w = wByDate[date];
    const cs = Object.keys(w);
    const tot = cs.reduce((x,c)=> x + w[c], 0);
    cs.forEach(c=>{
      if(!countries.includes(c)) return;
      const usd = tot > 0 ? perDay*(w[c]/tot) : perDay/cs.length;
      const v = toDisp(usd*fxRate(c), c);
      a.truckCost += v;
      if(a.byCountry[c]) a.byCountry[c].cost += v;
    });
    if(cs.some(c=>countries.includes(c))) a.cutoffDays++;
  });
  // 취급주의 출고비 — 월(또는 일) 단위 EA를 그 기간의 일별 출고 비율로 쪼개 구간에 싣는다
  const hRate = handlingPerEa();
  (CD.Cache.handling||[]).forEach(h=>{
    const ea = Number(h.ea)||0;
    if(!ea || !h.period || !countries.includes(h.country)) return;
    const isDay = h.period.length === 10;
    const days = CD.Cache.daily.filter(d=> d.country===h.country && d.date &&
      (isDay ? d.date===h.period : d.date.slice(0,7)===h.period));
    const tot = days.reduce((x,d)=> x + (d.shipped||0), 0);
    let inEa = 0;
    if(days.length && tot > 0){
      days.forEach(d=>{ if(d.date >= start && d.date <= end) inEa += ea*((d.shipped||0)/tot); });
    }else{
      const date = isDay ? h.period
        : h.period + "-" + CD.pad2(CD.daysInMonth(Number(h.period.slice(0,4)), Number(h.period.slice(5,7))-1));
      if(date >= start && date <= end) inEa = ea;
    }
    if(!inEa) return;
    const v = toDisp(inEa*hRate*fxRate(h.country), h.country);
    a.handlingEa += inEa;
    a.handlingCost += v;
    if(a.byCountry[h.country]) a.byCountry[h.country].cost += v;
  });
  a.total = a.packCost + a.lastMileCost + a.airCost + a.truckCost + a.handlingCost;
  a.perOrder = a.shipped>0 ? a.total/a.shipped : 0;
  a.packRate = a.picked>0 ? a.packed/a.picked : null;      // 픽킹 → 팩킹
  a.shipRate = a.packed>0 ? a.shipped/a.packed : null;     // 팩킹 → 출고
  a.skuPerBox = a.boxes>0 ? a.skuUnits/a.boxes : 0;
  a.avgDaily = a.days>0 ? a.shipped/a.days : 0;
  return a;
}

function months(){
  const set = new Set();
  CD.Cache.daily.forEach(r=>{ if(r.date) set.add(r.date.slice(0,7)); });
  return [...set].sort();
}
/** 월별 추이 차트용 — "YYYY-MM" 한 달치를 구간 집계로 돌린다 */
function aggMonth(m, countries){
  const start = m + "-01";
  const end = m + "-" + CD.pad2(CD.daysInMonth(Number(m.slice(0,4)), Number(m.slice(5,7))-1));
  return aggregate(start, end, countries);
}
/** 현재 선택 구간과 그 직전 동일 길이 구간 */
function windows(){
  const end = CD.todayISO();
  const start = CD.addDays(end, -(days-1));
  const pEnd = CD.addDays(start, -1);
  const pStart = CD.addDays(pEnd, -(days-1));
  return { start, end, pStart, pEnd };
}
function rangeLabel(a, b){ return `${CD.fmtShort(a)}~${CD.fmtShort(b)}`; }
function pct(now, before){
  if(before===null || before===undefined || before===0) return null;
  return ((now-before)/before)*100;
}
/** delta chip — 증가가 좋은 지표(good=true)면 초록, 비용처럼 낮을수록 좋은 지표면 반대 */
function delta(now, before, goodUp){
  const p = pct(now, before);
  if(p===null) return `<span class="delta">직전 ${days}일 데이터 없음</span>`;
  const up = p>0, flat = Math.abs(p) < 0.05;
  let cls = "";
  if(goodUp!==null && !flat) cls = (goodUp?up:!up) ? " good" : " bad";
  return `<span class="delta${cls}">${flat?"":(up?"▲":"▼")}${Math.abs(p).toFixed(1)}%</span>` +
         `<span style="color:var(--muted)">직전 ${days}일 대비</span>`;
}

/* ---------- 자동 인사이트 ---------- */
function insights(a, b){
  const out = [];
  const VS = `직전 ${days}일 대비`;
  const pShip = pct(a.shipped, b.shipped);
  if(pShip!==null && Math.abs(pShip)>=3){
    out.push(`출고량이 ${VS} <b>${pShip>0?"+":""}${pShip.toFixed(1)}%</b> (${CD.fmtNum(b.shipped)} → ${CD.fmtNum(a.shipped)}개) ${pShip>0?"증가":"감소"}했습니다.`);
  }
  const pDay = pct(a.avgDaily, b.avgDaily);
  if(pShip!==null && pDay!==null && Math.abs(pShip-pDay)>=4){
    out.push(`가동일이 ${b.days}일 → ${a.days}일로 달라져, 일평균 기준으로 보면 <b>${pDay>0?"+":""}${pDay.toFixed(1)}%</b>입니다. 총량 증감과 실제 처리 능력 변화를 구분해서 보셔야 합니다.`);
  }
  const pCost = pct(a.perOrder, b.perOrder);
  if(pCost!==null && Math.abs(pCost)>=2){
    out.push(`건당 물류비가 ${fmtMoney(b.perOrder)} → <b>${fmtMoney(a.perOrder)}</b> (${pCost>0?"+":""}${pCost.toFixed(1)}%)로 ${pCost>0?"악화":"개선"}됐습니다.`);
  }
  if(a.skuPerBox && b.skuPerBox){
    const d = a.skuPerBox - b.skuPerBox;
    if(Math.abs(d)>=0.03){
      // 박스 수 = 팩킹 건수로 고정이고, 단가는 종류가 하나 늘 때마다 올라간다.
      // 따라서 박스당 SKU 상승 = 박스 단가 상승 = 출고비 상승.
      const cpbA = a.boxes>0 ? a.packCost/a.boxes : 0;
      const cpbB = b.boxes>0 ? b.packCost/b.boxes : 0;
      out.push(`박스당 SKU가 ${b.skuPerBox.toFixed(2)} → <b>${a.skuPerBox.toFixed(2)}</b>로 ${d>0?"늘었":"줄었"}습니다. 종류가 하나 늘 때마다 단가가 붙는 구조라 박스당 출고비가 ${fmtMoney(cpbB)} → <b>${fmtMoney(cpbA)}</b>로 ${d>0?"오르는":"내리는"} 요인입니다.`);
    }
  }
  if(a.shipRate!==null && a.shipRate < 0.95){
    const carry = a.packed - a.shipped;
    out.push(`팩킹 대비 출고율이 <b>${(a.shipRate*100).toFixed(1)}%</b>로, ${CD.fmtNum(carry)}건이 이 구간 안에 출고되지 않았습니다. 항공 스케줄 또는 컷오프 일정을 확인해보세요.`);
  } else if(a.shipRate!==null && a.shipRate > 1.05){
    out.push(`팩킹보다 출고가 <b>${(a.shipRate*100).toFixed(1)}%</b>로 많습니다. 이전 구간 이월 물량이 이 구간에 나간 것으로 보입니다.`);
  }
  if(a.packRate!==null && a.packRate < 0.95){
    out.push(`픽킹 대비 팩킹률이 <b>${(a.packRate*100).toFixed(1)}%</b>입니다. 픽킹 후 포장까지 넘어가지 못한 물량이 있는지 확인이 필요합니다.`);
  }
  if(a.peak.date && a.avgDaily>0 && a.peak.v/a.avgDaily >= 2){
    out.push(`최다 출고일은 ${CD.fmtFull(a.peak.date)} <b>${CD.fmtNum(a.peak.v)}개</b>로 일평균(${CD.fmtNum(a.avgDaily)}개)의 ${(a.peak.v/a.avgDaily).toFixed(1)}배입니다. 특정일 물량 집중이 큽니다.`);
  }
  const cs = Object.keys(a.byCountry).filter(c=>a.byCountry[c].shipped>0);
  if(cs.length>1){
    const tot = cs.reduce((s,c)=>s+a.byCountry[c].shipped,0);
    const totB = cs.reduce((s,c)=>s+(b.byCountry[c]?b.byCountry[c].shipped:0),0);
    cs.forEach(c=>{
      if(!tot || !totB) return;
      const sh = a.byCountry[c].shipped/tot*100;
      const shB = (b.byCountry[c]?b.byCountry[c].shipped:0)/totB*100;
      if(Math.abs(sh-shB)>=5){
        out.push(`${CD.COUNTRY_LABEL[c]} 비중이 ${shB.toFixed(1)}% → <b>${sh.toFixed(1)}%</b>로 ${sh>shB?"확대":"축소"}됐습니다.`);
      }
    });
  }
  if(!out.length) out.push(`직전 ${days}일과 비교해 특별히 눈에 띄는 변화는 없습니다.`);
  return out;
}

/* ---------- 화면 ---------- */
function shell(){

        </div>
      </div>
      <div class="seg" id="rpCurSeg">
        <button data-v="KRW">₩ 원화</button>

      </div>
    </div>

    <div class="section grid kpis3" id="rpKpis"></div>

    <div class="section grid two">
      <div class="card">
        <div class="section-head"><h2 id="rpSummaryTitle">최근 30일 요약</h2><span class="hint" id="rpVs"></span></div>

          <thead><tr><th>국가</th><th>픽킹</th><th>팩킹</th><th>출고</th><th>박스</th><th>박스당 SKU</th><th>물류비</th><th>건당비용</th><th id="rpThDelta">직전 구간 대비 출고</th></tr></thead>
          <tbody id="rpTableBody"></tbody>
        </table>

    <div class="section">

      <div class="card"><div id="rpTrendChart"></div><div class="chart-legend" id="rpTrendLegend"></div></div>
    </div>

    <div class="section">
      <div class="section-head"><h2>월별 건당 물류비 추이</h2></div>
      <div class="card"><div id="rpCostChart"></div><div class="chart-legend" id="rpCostLegend"></div></div>

  `;
  document.getElementById("rpRangeSeg").addEventListener("click", e=>{

    days = Number(b.dataset.v);
    [...b.parentElement.children].forEach(c=>c.classList.toggle("active", c===b));
    refresh();
  });
  document.getElementById("rpCountrySeg").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    countryFilter=b.dataset.v; [...b.parentElement.children].forEach(c=>c.classList.toggle("active",c===b)); refresh();
  });
  document.getElementById("rpCurSeg").querySelectorAll("button").forEach(b=> b.classList.toggle("active", b.dataset.v===cur));
  document.getElementById("rpCurSeg").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    cur=b.dataset.v; [...b.parentElement.children].forEach(c=>c.classList.toggle("active",c===b));
    try{ localStorage.setItem("cargodesk_dispCurrency", cur); }catch(err){}
    refresh();
