        </div>
      </div>
      <div class="field" style="margin-top:12px;"><label>인보이스 번호</label>
        <input type="text" id="ivNo" class="mono" value="${doc && !isAuto ? esc(doc.invoiceNo) : ""}" placeholder="예: NSI-0825WA-OPLE">
      </div>

      <div class="row between" style="margin:18px 0 8px;">
        <b style="font-size:12.5px;">청구 항목</b>
        <button type="button" class="btn small ghost" id="ivAddLine">+ 항목 추가</button>
      </div>
      <div class="line-table">
        <div class="line-head"><span>항목</span><span>금액</span><span>비고 (선택)</span><span></span></div>
        <div id="ivLines"></div>
      </div>

      <div class="row between" style="margin:18px 0 8px;">
        <b style="font-size:12.5px;">디스카운트 · 할인</b>
        <button type="button" class="btn small ghost" id="ivAddDisc">+ 할인 추가</button>
      </div>
      <div class="line-table disc" id="ivDiscBox">
        <div class="line-head"><span>할인 사유</span><span>할인 금액</span><span></span></div>
        <div id="ivDiscs"></div>
        <div class="disc-empty" id="ivDiscEmpty">이 인보이스에서 깎인 금액이 있으면 추가하세요. 합계에서 바로 빠집니다.</div>
      </div>

      <div class="line-total">
        <div class="row between"><span>청구 합계</span><span class="mono" id="ivGross">-</span></div>
        <div class="row between" id="ivDiscRow" hidden><span>할인</span><span class="mono minus" id="ivDisc">-</span></div>
        <div class="row between net"><span>인보이스 합계</span><b id="ivTotal" class="mono">-</b></div>
      </div>

      <div class="help" id="ivHelp" style="margin-top:10px;"></div>
      <div class="modal-foot" style="margin-top:16px;">
        ${editingId ? `<button type="button" class="btn danger ghost" id="ivDelete" style="margin-right:auto;">인보이스 삭제</button>` : ``}
        <button type="button" class="btn ghost" id="ivCancel">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  `;
  overlay.hidden = false;

  const vendorEl = document.getElementById("ivVendor");
  const curEl = document.getElementById("ivCur");
  const periodEl = document.getElementById("ivPeriod");
  const dateEl = document.getElementById("ivDate");
  const linesEl = document.getElementById("ivLines");
  const discsEl = document.getElementById("ivDiscs");
  const helpEl = document.getElementById("ivHelp");

  function drawLines(){
    linesEl.innerHTML = lines.map((l,i)=>`
      <div class="line-row-edit" data-i="${i}">
        <select data-f="item">${itemOptions(vendorEl.value, l.item)}</select>
        <input type="number" step="0.01" min="0" class="num-input mono" data-f="amount" value="${l.amount===""?"":l.amount}" placeholder="0.00">
        <input type="text" data-f="memo" value="${esc(l.memo)}" placeholder="">
        <button type="button" class="btn small danger ghost" data-rm="${i}" ${lines.length<=1?"disabled":""}>✕</button>
      </div>`).join("");
    linesEl.querySelectorAll(".line-row-edit").forEach(row=>{
      const i = Number(row.dataset.i);
      row.querySelectorAll("[data-f]").forEach(el=>{
        el.addEventListener("input", ()=>{
          lines[i][el.dataset.f] = el.dataset.f==="amount" ? (el.value===""?"":Number(el.value)) : el.value;
          if(el.dataset.f==="amount") drawTotal();
        });
        el.addEventListener("change", ()=>{
          lines[i][el.dataset.f] = el.dataset.f==="amount" ? (el.value===""?"":Number(el.value)) : el.value;
          drawTotal(); syncHelp();
        });
      });
      row.querySelector("[data-rm]").addEventListener("click", ()=>{
        if(lines.length<=1) return;
        lines.splice(i,1); drawLines(); drawTotal();
      });
    });
    drawTotal();
  }
  function drawDiscs(){
    discsEl.innerHTML = discs.map((d,i)=>`
      <div class="line-row-edit disc" data-d="${i}">
        <input type="text" data-f="memo" value="${esc(d.memo)}" placeholder="예: 볼륨 할인, 장기 계약 할인">
        <input type="number" step="0.01" min="0" class="num-input mono" data-f="amount" value="${d.amount===""?"":d.amount}" placeholder="0.00">
        <button type="button" class="btn small danger ghost" data-drm="${i}">✕</button>
      </div>`).join("");
    document.getElementById("ivDiscEmpty").hidden = discs.length > 0;
    discsEl.querySelectorAll(".line-row-edit").forEach(row=>{
      const i = Number(row.dataset.d);
      row.querySelectorAll("[data-f]").forEach(el=>{
        const set = ()=>{ discs[i][el.dataset.f] = el.dataset.f==="amount" ? (el.value===""?"":Number(el.value)) : el.value; drawTotal(); };
        el.addEventListener("input", set);
        el.addEventListener("change", set);
      });
      row.querySelector("[data-drm]").addEventListener("click", ()=>{ discs.splice(i,1); drawDiscs(); drawTotal(); });
    });
    drawTotal();
  }
  function drawTotal(){
    const g = lines.reduce((s,l)=> s + (Number(l.amount)||0), 0);
    const d = discs.reduce((s,x)=> s + (Number(x.amount)||0), 0);
    document.getElementById("ivGross").textContent = fmtIn(g, curEl.value);
    document.getElementById("ivDiscRow").hidden = !discs.length;
    document.getElementById("ivDisc").textContent = "-" + fmtIn(d, curEl.value);
    document.getElementById("ivTotal").textContent = fmtIn(g - d, curEl.value);
  }
  function syncHelp(){
    const vv = V_BY_KEY[vendorEl.value];
    const autoItem = vv.mode === "auto" ? vv.auto.item : null;
    if(autoItem && lines.some(l=> l.item === autoItem)){
      const a = autoAmount(vv.key, periodEl.value);
      helpEl.innerHTML = `${vv.note}. <b>${periodEl.value}</b> 자동 계산액은 <b>${a==null?"-":fmtIn(Math.round(a*100)/100, vv.currency)}</b>`
        + ` (${autoBasis(vv.key, periodEl.value) || "데이터 없음"}). 저장하면 <b>실제 청구액이 자동 계산을 대신합니다.</b>`;
    }else{
      helpEl.innerHTML = `${vv.label} · ${vv.note} · 기본 청구 통화 ${vv.currency} · <b>귀속 월</b>이 카드·차트 집계 기준입니다.`;
    }
  }

  vendorEl.addEventListener("change", ()=>{
    const vv = V_BY_KEY[vendorEl.value];
    const allow = itemsFor(vv.key);
    lines = lines.map(l=> allow.indexOf(l.item)>=0 ? l : {...l, item:allow[0]});
    curEl.value = vv.currency;
    drawLines(); syncHelp();
  });
  curEl.addEventListener("change", drawTotal);   // 할인·합계 표기 통화 동기화
  // 날짜를 고르면 귀속 월을 같이 맞춰 준다 (직접 바꿀 수 있다)
  dateEl.addEventListener("change", ()=>{
    if(dateEl.value && !doc) periodEl.value = dateEl.value.slice(0,7);
    syncHelp();
  });
  periodEl.addEventListener("change", syncHelp);
  document.getElementById("ivAddDisc").addEventListener("click", ()=>{
    discs.push({ amount:"", memo:"" });
    drawDiscs();
    const last = discsEl.querySelector(".line-row-edit:last-child input");
    if(last) last.focus();
  });
  document.getElementById("ivAddLine").addEventListener("click", ()=>{
    const used = lines.map(l=>l.item);
    const next = itemsFor(vendorEl.value).find(k=> used.indexOf(k)<0) || itemsFor(vendorEl.value)[0];
    lines.push({ item:next, amount:"", memo:"" });
    drawLines();
  });
  document.getElementById("ivClose").addEventListener("click", closeForm);
  document.getElementById("ivCancel").addEventListener("click", closeForm);
  const delBtn = document.getElementById("ivDelete");
  if(delBtn) delBtn.addEventListener("click", async ()=>{
    if(!confirm("이 인보이스를 통째로 삭제할까요?")) return;
    await CD.Store.deleteInvoice(editingId);
    closeForm();
  });

  drawLines(); drawDiscs(); syncHelp();

  document.getElementById("ivForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const period = periodEl.value;
    if(!period){ alert("귀속 월을 선택하세요."); return; }
    const clean = lines.filter(l=> l.item && (Number(l.amount)||0) !== 0)
                       .map(l=> ({ item:l.item, amount:Number(l.amount)||0, memo:(l.memo||"").trim() }));
    if(!clean.length){ alert("금액이 있는 항목을 최소 한 줄 입력하세요."); return; }
    // 할인 줄도 같은 목록에 담는다 (item:"discount") — 합계에서 자동으로 빠진다
    discs.filter(d=> (Number(d.amount)||0) !== 0)
         .forEach(d=> clean.push({ item:"discount", amount:Number(d.amount)||0, memo:(d.memo||"").trim() }));
    const dup = clean.filter(l=> l.item!=="discount").map(l=>l.item).filter((k,i,a)=> a.indexOf(k)!==i);
    if(dup.length && !confirm(`같은 항목이 두 번 들어 있습니다 (${dup.map(k=>ITEM_LABEL[k]).join(", ")}). 그대로 저장할까요?`)) return;
    await CD.Store.upsertInvoice({
      id: editingId || CD.uid("iv"),
      vendor: vendorEl.value,
      invoiceNo: document.getElementById("ivNo").value.trim(),
      date: dateEl.value || "",
      period,
      currency: curEl.value,
      memo: "",
      lines: clean
    });
    closeForm();
  });
}

/* ---------------------------------------------------------------------
   크레딧 입력 (전용)
   --------------------------------------------------------------------- */
function openCredit(doc){
  editingId = doc ? doc.id : null;
  const vk = doc ? doc.vendor : VENDORS[0].key;
  const v = V_BY_KEY[vk];
  const line = doc ? doc.lines[0] : {amount:"", memo:""};
  modalBody.className = "modal";
  modalBody.innerHTML = `
    <div class="modal-head">
      <h3><span class="credit-chip">크레딧</span> ${doc ? "수정" : "입력"}</h3>
      <button class="close-x" type="button" id="cvClose">&times;</button>
    </div>
    <form id="cvForm">
      <div class="grid" style="grid-template-columns:1fr 1fr; gap:12px;">
        <div class="field"><label>업체</label>
          <select id="cvVendor">${VENDORS.map(x=>`<option value="${x.key}"${x.key===vk?" selected":""}>${x.label}</option>`).join("")}</select>
        </div>
        <div class="field"><label>반영 월</label>
          <input type="month" id="cvPeriod" class="mono" value="${doc ? doc.period : thisMonth()}" required>
        </div>
        <div class="field"><label>크레딧 금액</label>
          <input type="number" step="0.01" min="0" class="num-input" id="cvAmount" value="${line.amount}" required>
        </div>
        <div class="field"><label>통화</label>
          <select id="cvCur">
            ${["USD","KRW","JPY"].map(c=>`<option value="${c}"${c===(doc?doc.currency:v.currency)?" selected":""}>${c}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;">
        <div class="field"><label>크레딧 날짜 (선택)</label>
          <input type="date" id="cvDate" class="mono" value="${doc ? esc(doc.date) : ""}">
        </div>
        <div class="field"><label>관련 인보이스 번호 (선택)</label>
          <input type="text" id="cvNo" class="mono" value="${doc ? esc(doc.invoiceNo) : ""}">
        </div>
      </div>
      <div class="field" style="margin-top:12px;"><label>사유 · 메모 (선택)</label>
        <input type="text" id="cvMemo" value="${esc(line.memo)}" placeholder="예: 파손 보상, 중복 청구 반환">
      </div>
      <div class="help" style="margin-top:8px;">받을 금액을 <b>양수로</b> 입력하세요. 선택한 <b>반영 월</b>의 그 업체 청구액에서 자동으로 차감됩니다.</div>
      <div class="modal-foot" style="margin-top:16px;">
        ${doc ? `<button type="button" class="btn danger ghost" id="cvDelete" style="margin-right:auto;">삭제</button>` : ``}
        <button type="button" class="btn ghost" id="cvCancel">취소</button>
        <button type="submit" class="btn credit">크레딧 저장</button>
      </div>
    </form>
  `;
  overlay.hidden = false;
  const vendorEl = document.getElementById("cvVendor");
  const curEl = document.getElementById("cvCur");
  vendorEl.addEventListener("change", ()=>{ curEl.value = V_BY_KEY[vendorEl.value].currency; });
  document.getElementById("cvClose").addEventListener("click", closeForm);
  document.getElementById("cvCancel").addEventListener("click", closeForm);
  const delBtn = document.getElementById("cvDelete");
  if(delBtn) delBtn.addEventListener("click", async ()=>{
    if(!confirm("이 크레딧을 삭제할까요?")) return;
    await CD.Store.deleteInvoice(editingId);
    closeForm();
  });
  document.getElementById("cvForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const period = document.getElementById("cvPeriod").value;
    if(!period){ alert("반영 월을 선택하세요."); return; }
    await CD.Store.upsertInvoice({
      id: editingId || CD.uid("cr"),
      vendor: vendorEl.value,
      invoiceNo: document.getElementById("cvNo").value.trim(),
      date: document.getElementById("cvDate").value || "",
      period,
      currency: curEl.value,
      memo: "",
      lines: [{ item:"credit", amount:Number(document.getElementById("cvAmount").value)||0,
                memo: document.getElementById("cvMemo").value.trim() }]
    });
    closeForm();
  });
}

/* ---------------------------------------------------------------------
   엑셀 내보내기 — 인보이스 요약 + 항목 상세 두 시트
   --------------------------------------------------------------------- */
const XLSX_CDN = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = XLSX_CDN;
    s.onload = ()=> resolve(window.XLSX);
    s.onerror = ()=> reject(new Error("엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."));
    document.head.appendChild(s);
  });
}
async function exportInvoices(){
  try{
    const XLSX = await loadXlsx();
    const docs = lastDocs.slice().sort((a,b)=> sortKey(a) < sortKey(b) ? -1 : 1);
    const wb = XLSX.utils.book_new();

    const sum = [["인보이스 날짜","귀속 월","업체","인보이스 번호","입력 방식","통화","항목 수","청구 금액","환산("+cur+")"]];
    docs.forEach(d=> sum.push([ d.date||"", d.period, vLabel(d.vendor), d.invoiceNo||"",
      d.auto?"자동 계산":"직접 입력", d.currency, d.lines.length,
      Number(docTotal(d).toFixed(2)), docDispTotal(d) ]));
    const sTotal = docs.reduce((s,d)=> s + docDispTotal(d), 0);
    sum.push([]); sum.push(["합계","","","","","","","", Number(sTotal.toFixed(2))]);
    const ws1 = XLSX.utils.aoa_to_sheet(sum);
    ws1["!cols"] = [{wch:13},{wch:10},{wch:12},{wch:20},{wch:11},{wch:7},{wch:8},{wch:14},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws1, "인보이스");

    const det = [["인보이스 날짜","귀속 월","업체","인보이스 번호","항목","입력 방식","통화","청구 금액","환산("+cur+")","비고"]];
    docs.forEach(d=> d.lines.forEach(l=>{
      const L = {...l, currency:d.currency};
      det.push([ d.date||"", d.period, vLabel(d.vendor), d.invoiceNo||"", ITEM_LABEL[l.item]||l.item,
        d.auto?"자동 계산":"직접 입력", d.currency,
        Number(signedAmt(l.item, l.amount).toFixed(2)), dispAmt(L), l.memo||"" ]);
    }));
    det.push([]); det.push(["합계","","","","","","","", Number(sTotal.toFixed(2)),""]);
    const ws2 = XLSX.utils.aoa_to_sheet(det);
    ws2["!cols"] = [{wch:13},{wch:10},{wch:12},{wch:20},{wch:16},{wch:11},{wch:7},{wch:14},{wch:14},{wch:24}];
    XLSX.utils.book_append_sheet(wb, ws2, "항목 상세");

    const vTxt = vendorFilter==="ALL" ? "전체" : V_BY_KEY[vendorFilter].label;
    XLSX.writeFile(wb, `인보이스_${vTxt}_${iRange.start}_${iRange.end}_${cur}.xlsx`);
  }catch(err){
    alert(String(err.message||err));
  }
}

CD.on("invoices", refresh);
CD.on("settings", refresh);
CD.on("daily", refresh);
CD.on("shipments", refresh);
CD.on("tab", t=>{ if(t==="invoices") refresh(); });
CD.on("ready", ()=>{ shell(); refresh(); });
})();
</script>
